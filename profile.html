
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>الملف التعريفي</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: "Cairo", sans-serif;
            background: #f8f9fd;
            color: #171827;
            min-height: 100vh;
            padding-bottom: 40px;
        }


        .page {
            width: min(650px, calc(100% - 30px));
            margin: auto;
        }


        /* =========================
           الهيدر
        ========================= */

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 22px 0;
        }


        .back-button {
            width: 46px;
            height: 46px;

            border: none;
            border-radius: 15px;

            background: white;

            box-shadow:
                0 8px 25px rgba(50,50,100,.07);

            font-size: 22px;
            cursor: pointer;
        }


        .header h1 {
            font-size: 22px;
            font-weight: 800;
        }


        .header p {
            color: #858796;
            font-size: 11px;
        }


        /* =========================
           بطاقة البروفايل
        ========================= */

        .profile-card {
            background: white;
            border-radius: 25px;
            padding: 25px;

            box-shadow:
                0 8px 25px rgba(50,50,100,.05);

            text-align: center;
        }


        .profile-avatar {
            width: 90px;
            height: 90px;

            margin: auto;

            border-radius: 50%;

            background: #eeeaff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;

            margin-bottom: 15px;
        }


        .profile-card h2 {
            font-size: 21px;
            font-weight: 800;
        }


        .profile-email {
            margin-top: 5px;
            color: #858796;
            font-size: 12px;
            direction: ltr;
        }


        /* =========================
           البيانات
        ========================= */

        .info-list {
            margin-top: 20px;

            display: grid;
            gap: 10px;
        }


        .info-item {
            background: #f8f9fd;

            border-radius: 16px;

            padding: 14px 16px;

            display: flex;
            align-items: center;

            gap: 12px;

            text-align: right;
        }


        .info-icon {
            width: 40px;
            height: 40px;

            border-radius: 12px;

            background: #eeeaff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            flex-shrink: 0;
        }


        .info-text {
            flex: 1;
        }


        .info-text span {
            display: block;

            color: #858796;

            font-size: 10px;

            margin-bottom: 2px;
        }


        .info-text strong {
            display: block;

            font-size: 13px;

            font-weight: 700;

            word-break: break-word;
        }


        /* =========================
           الأزرار
        ========================= */

        .actions {
            margin-top: 20px;

            display: grid;

            gap: 12px;
        }


        .action-button {
            width: 100%;

            min-height: 55px;

            border: none;

            border-radius: 17px;

            background: white;

            box-shadow:
                0 8px 25px rgba(50,50,100,.05);

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 18px;

            color: #171827;
        }


        .action-button .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .action-icon {
            width: 36px;
            height: 36px;

            border-radius: 11px;

            background: #eeeaff;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .arrow {
            color: #858796;
            font-size: 18px;
        }


        .logout-button {
            width: 100%;

            height: 52px;

            margin-top: 10px;

            border: none;

            border-radius: 16px;

            background: #fff0f3;

            color: #ff4d67;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;
        }


        /* =========================
           تحميل
        ========================= */

        .loading {
            text-align: center;

            padding: 80px 20px;

            color: #858796;
        }


        .loading-icon {
            font-size: 45px;

            margin-bottom: 10px;
        }


        /* =========================
           غير مسجل
        ========================= */

        .login-card {
            background: white;

            border-radius: 25px;

            padding: 40px 25px;

            text-align: center;

            box-shadow:
                0 8px 25px rgba(50,50,100,.05);
        }


        .login-icon {
            font-size: 50px;

            margin-bottom: 15px;
        }


        .login-card h2 {
            font-size: 20px;

            font-weight: 800;
        }


        .login-card p {
            color: #858796;

            font-size: 12px;

            margin-top: 7px;
        }


        .login-button {
            margin-top: 20px;

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 16px;

            background: #6557ed;

            color: white;

            font-family: inherit;

            font-weight: 800;

            cursor: pointer;
        }

    </style>

</head>


<body>


<div class="page">

    <!-- الهيدر -->

    <header class="header">

        <button
            class="back-button"
            onclick="history.back()"
        >
            →
        </button>

        <div>

            <h1>
                👤 الملف التعريفي
            </h1>

            <p>
                معلومات حسابك
            </p>

        </div>

    </header>


    <!-- المحتوى -->

    <main id="content">

        <div class="loading">

            <div class="loading-icon">
                👤
            </div>

            جاري تحميل الحساب...

        </div>

    </main>

</div>


<script>


// =========================
// تحميل البروفايل
// =========================

async function loadProfile() {

    const content =
        document.getElementById("content");


    // الحصول على المستخدم الحالي

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();


    // غير مسجل

    if (error || !user) {

        content.innerHTML = `

            <div class="login-card">

                <div class="login-icon">
                    🔐
                </div>

                <h2>
                    أنت غير مسجل الدخول
                </h2>

                <p>
                    سجل دخولك للوصول إلى ملفك التعريفي
                </p>

                <button
                    class="login-button"
                    onclick="window.location.href='login.html'"
                >
                    تسجيل الدخول
                </button>

            </div>

        `;

        return;
    }


    // =========================
    // بيانات المستخدم
    // =========================

    const email =
        user.email || "غير متوفر";


    const name =
        user.user_metadata?.name ||
        user.user_metadata?.full_name ||
        user.user_metadata?.username ||
        "مستخدم";


    const phone =
        user.user_metadata?.phone ||
        user.phone ||
        "غير مضاف";


    // =========================
    // عرض الصفحة
    // =========================

    content.innerHTML = `

        <section class="profile-card">

            <div class="profile-avatar">
                👤
            </div>


            <h2>
                ${escapeHtml(name)}
            </h2>


            <div class="profile-email">
                ${escapeHtml(email)}
            </div>


            <div class="info-list">

                <div class="info-item">

                    <div class="info-icon">
                        👤
                    </div>

                    <div class="info-text">

                        <span>
                            الاسم
                        </span>

                        <strong>
                            ${escapeHtml(name)}
                        </strong>

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon">
                        📧
                    </div>

                    <div class="info-text">

                        <span>
                            البريد الإلكتروني
                        </span>

                        <strong dir="ltr">
                            ${escapeHtml(email)}
                        </strong>

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon">
                        📱
                    </div>

                    <div class="info-text">

                        <span>
                            رقم الجوال
                        </span>

                        <strong>
                            ${escapeHtml(phone)}
                        </strong>

                    </div>

                </div>


            </div>

        </section>


        <section class="actions">


            <!-- السلة -->

            <button
                class="action-button"
                onclick="window.location.href='orders.html'"
            >

                <div class="right">

                    <div class="action-icon">
                        🛍️
                    </div>

                    <span>
                        السلة
                    </span>

                </div>

                <span class="arrow">
                    ←
                </span>

            </button>


            <!-- الطلبات السابقة -->

            <button
                class="action-button"
                onclick="window.location.href='orders.html'"
            >

                <div class="right">

                    <div class="action-icon">
                        📋
                    </div>

                    <span>
                        الطلبات السابقة
                    </span>

                </div>

                <span class="arrow">
                    ←
                </span>

            </button>


        </section>


        <!-- تسجيل الخروج -->

        <button
            class="logout-button"
            onclick="logoutProfile()"
        >
            🚪 تسجيل الخروج
        </button>

    `;

}


// =========================
// تسجيل الخروج
// =========================

async function logoutProfile() {

    const confirmed =
        confirm("هل تريد تسجيل الخروج؟");


    if (!confirmed) return;


    const { error } =
        await supabaseClient.auth.signOut();


    if (error) {

        alert("حدث خطأ أثناء تسجيل الخروج");

        console.error(error);

        return;
    }


    window.location.href = "login.html";

}


// =========================
// حماية عرض البيانات
// =========================

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// تشغيل الصفحة

loadProfile();


</script>


</body>

</html>
