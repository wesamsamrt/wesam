
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>الملف التعريفي</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: "Cairo", sans-serif;
            background: #f8f9fd;
            color: #171827;
            min-height: 100vh;
            padding-bottom: 40px;
        }


        .page {
            width: min(650px, calc(100% - 30px));
            margin: auto;
        }


        /* =========================
           الهيدر
        ========================= */

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 22px 0;
        }


        .back-button {
            width: 46px;
            height: 46px;

            border: none;
            border-radius: 15px;

            background: white;

            box-shadow:
                0 8px 25px rgba(50,50,100,.07);

            font-size: 22px;
            cursor: pointer;
        }


        .header h1 {
            font-size: 22px;
            font-weight: 800;
        }


        .header p {
            color: #858796;
            font-size: 11px;
        }


        /* =========================
           بطاقة البروفايل
        ========================= */

        .profile-card {
            background: white;
            border-radius: 25px;
            padding: 25px;

            box-shadow:
                0 8px 25px rgba(50,50,100,.05);

            text-align: center;
        }


        .profile-avatar {
            width: 90px;
            height: 90px;

            margin: auto;

            border-radius: 50%;

            background: #eeeaff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;

            margin-bottom: 15px;
        }


        .profile-card h2 {
            font-size: 21px;
            font-weight: 800;
        }


        .profile-email {
            margin-top: 5px;
            color: #858796;
            font-size: 12px;
            direction: ltr;
        }


        /* =========================
           البيانات
        ========================= */

        .info-list {
            margin-top: 20px;

            display: grid;
            gap: 10px;
        }


        .info-item {
            background: #f8f9fd;

            border-radius: 16px;

            padding: 14px 16px;

            display: flex;
            align-items: center;

            gap: 12px;

            text-align: right;
        }


        .info-icon {
            width: 40px;
            height: 40px;

            border-radius: 12px;

            background: #eeeaff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            flex-shrink: 0;
        }


        .info-text {
            flex: 1;
        }


        .info-text span {
            display: block;

            color: #858796;

            font-size: 10px;

            margin-bottom: 2px;
        }


        .info-text strong {
            display: block;

            font-size: 13px;

            font-weight: 700;

            word-break: break-word;
        }


        /* =========================
           الأزرار
        ========================= */

        .actions {
            margin-top: 20px;

            display: grid;

            gap: 12px;
        }


        .action-button {
            width: 100%;

            min-height: 55px;

            border: none;

            border-radius: 17px;

            background: white;

            box-shadow:
                0 8px 25px rgba(50,50,100,.05);

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 18px;

            color: #171827;
        }


        .action-button .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .action-icon {
            width: 36px;
            height: 36px;

            border-radius: 11px;

            background: #eeeaff;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .arrow {
            color: #858796;
            font-size: 18px;
        }


        .logout-button {
            width: 100%;

            height: 52px;

            margin-top: 10px;

            border: none;

            border-radius: 16px;

            background: #fff0f3;

            color: #ff4d67;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;
        }


        /* =========================
           تحميل
        ========================= */

        .loading {
            text-align: center;

            padding: 80px 20px;

            color: #858796;
        }


        .loading-icon {
            font-size: 45px;

            margin-bottom: 10px;
        }


        /* =========================
           غير مسجل
        ========================= */

        .login-card {
            background: white;

            border-radius: 25px;

            padding: 40px 25px;

            text-align: center;

            box-shadow:
                0 8px 25px rgba(50,50,100,.05);
        }


        .login-icon {
            font-size: 50px;

            margin-bottom: 15px;
        }


        .login-card h2 {
            font-size: 20px;

            font-weight: 800;
        }


        .login-card p {
            color: #858796;

            font-size: 12px;

            margin-top: 7px;
        }


        .login-button {
            margin-top: 20px;

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 16px;

            background: #6557ed;

            color: white;

            font-family: inherit;

            font-weight: 800;

            cursor: pointer;
        }

        .password-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(12, 18, 40, .52);
        }

        .password-dialog {
            width: min(420px, 100%);
            padding: 25px;
            border-radius: 25px;
            background: #fff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .22);
        }

        .password-dialog p { color: #858796; font-size: 12px; margin-top: 7px; }
        .password-dialog input { width: 100%; height: 50px; margin-top: 12px; padding: 0 14px; border: 1px solid #e1e3ed; border-radius: 14px; font: inherit; outline: none; }
        .password-dialog input:focus { border-color: #6557ed; box-shadow: 0 0 0 3px rgba(101,87,237,.12); }
        .password-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
        .password-actions button { height: 48px; border: 0; border-radius: 14px; font: inherit; font-weight: 800; cursor: pointer; }
        .password-cancel { background: #f1f2f7; color: #4e5160; }.password-save { background: #6557ed; color: #fff; }
        .password-message { min-height: 20px; margin-top: 10px; font-size: 12px; }

    </style>

</head>


<body>


<div class="page">

    <!-- الهيدر -->

    <header class="header">

        <button
            class="back-button"
            onclick="history.back()"
        >
            →
        </button>

        <div>

            <h1>
                👤 الملف التعريفي
            </h1>

            <p>
                معلومات حسابك
            </p>

        </div>

    </header>


    <!-- المحتوى -->

    <main id="content">

        <div class="loading">

            <div class="loading-icon">
                👤
            </div>

            جاري تحميل الحساب...

        </div>

    </main>

</div>


<script>


// =========================
// تحميل البروفايل
// =========================

async function loadProfile() {

    const content =
        document.getElementById("content");


    // الحصول على المستخدم الحالي

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();


    // غير مسجل

    if (error || !user) {

        content.innerHTML = `

            <div class="login-card">

                <div class="login-icon">
                    🔐
                </div>

                <h2>
                    أنت غير مسجل الدخول
                </h2>

                <p>
                    سجل دخولك للوصول إلى ملفك التعريفي
                </p>

                <button
                    class="login-button"
                    onclick="window.location.href='login.html'"
                >
                    تسجيل الدخول
                </button>

            </div>

        `;

        return;
    }


    // =========================
    // بيانات المستخدم
    // =========================

    const email =
        user.email || "غير متوفر";


    const name =
        user.user_metadata?.name ||
        user.user_metadata?.full_name ||
        user.user_metadata?.username ||
        "مستخدم";


    const phone =
        user.user_metadata?.phone ||
        user.phone ||
        "غير مضاف";


    // =========================
    // عرض الصفحة
    // =========================

    content.innerHTML = `

        <section class="profile-card">

            <div class="profile-avatar">
                👤
            </div>


            <h2>
                ${escapeHtml(name)}
            </h2>


            <div class="profile-email">
                ${escapeHtml(email)}
            </div>


            <div class="info-list">

                <div class="info-item">

                    <div class="info-icon">
                        👤
                    </div>

                    <div class="info-text">

                        <span>
                            الاسم
                        </span>

                        <strong>
                            ${escapeHtml(name)}
                        </strong>

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon">
                        📧
                    </div>

                    <div class="info-text">

                        <span>
                            البريد الإلكتروني
                        </span>

                        <strong dir="ltr">
                            ${escapeHtml(email)}
                        </strong>

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon">
                        📱
                    </div>

                    <div class="info-text">

                        <span>
                            رقم الجوال
                        </span>

                        <strong>
                            ${escapeHtml(phone)}
                        </strong>

                    </div>

                </div>


            </div>

        </section>


        <section class="actions">


            <!-- السلة -->

            <button
                class="action-button"
                onclick="window.location.href='orders.html'"
            >

                <div class="right">

                    <div class="action-icon">
                        🛍️
                    </div>

                    <span>
                        السلة
                    </span>

                </div>

                <span class="arrow">
                    ←
                </span>

            </button>


            <!-- الطلبات السابقة -->

            <button
                class="action-button"
                onclick="window.location.href='orders.html'"
            >

                <div class="right">

                    <div class="action-icon">
                        📋
                    </div>

                    <span>
                        الطلبات السابقة
                    </span>

                </div>

                <span class="arrow">
                    ←
                </span>

            </button>


            <button
                class="action-button"
                type="button"
                onclick="openPasswordChange()"
            >
                <div class="right">
                    <div class="action-icon">🔒</div>
                    <span>تغيير كلمة المرور</span>
                </div>
                <span class="arrow">←</span>
            </button>
<button
    class="action-button"
    onclick="openDriverRegistration()"
>
    <div class="right">
        <div class="action-icon">
            🚚
        </div>

        <span>
            التسجيل كمندوب
        </span>
    </div>

    <span class="arrow">
        ←
    </span>
</button>

        </section>


        <!-- تسجيل الخروج -->

        <button
            class="logout-button"
            onclick="logoutProfile()"
        >
            🚪 تسجيل الخروج
        </button>

    `;

}


// يفتح نموذج تغيير كلمة مرور الحساب الحالي ويعيد تهيئته عند كل فتح.
function openPasswordChange() {
    const modal = document.getElementById("passwordModal");
    const password = document.getElementById("newPasswordInput");
    const confirmation = document.getElementById("confirmPasswordInput");
    const message = document.getElementById("passwordChangeMessage");
    password.value = "";
    confirmation.value = "";
    message.textContent = "";
    modal.style.display = "flex";
    setTimeout(() => password.focus(), 100);
}

// يغلق نموذج كلمة المرور دون حفظ أي بيانات مكتوبة.
function closePasswordChange() {
    document.getElementById("passwordModal").style.display = "none";
}

// يتحقق من كلمة المرور الجديدة ثم يحفظها للحساب الذي سجّل الدخول فقط.
async function saveNewPassword() {
    const password = document.getElementById("newPasswordInput").value;
    const confirmation = document.getElementById("confirmPasswordInput").value;
    const message = document.getElementById("passwordChangeMessage");
    const button = document.getElementById("savePasswordButton");

    if (password.length < 6) {
        message.textContent = "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";
        message.style.color = "#e05265";
        return;
    }
    if (password !== confirmation) {
        message.textContent = "تأكيد كلمة المرور غير مطابق.";
        message.style.color = "#e05265";
        return;
    }

    button.disabled = true;
    button.textContent = "جاري الحفظ...";
    const { error } = await supabaseClient.auth.updateUser({ password });
    button.disabled = false;
    button.textContent = "حفظ كلمة المرور";

    if (error) {
        message.textContent = error.message || "تعذر تغيير كلمة المرور.";
        message.style.color = "#e05265";
        return;
    }

    message.textContent = "تم تغيير كلمة المرور بنجاح ✅";
    message.style.color = "#2e9d69";
    setTimeout(closePasswordChange, 900);
}

// =========================
// تسجيل الخروج
// =========================

async function logoutProfile() {

    const confirmed =
        confirm("هل تريد تسجيل الخروج؟");


    if (!confirmed) return;


    const { error } =
        await supabaseClient.auth.signOut();


    if (error) {

        alert("حدث خطأ أثناء تسجيل الخروج");

        console.error(error);

        return;
    }


    window.location.href = "login.html";

}


// =========================
// حماية عرض البيانات
// =========================

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// تشغيل الصفحة




// =========================
// التسجيل كمندوب
// =========================

function openDriverRegistration() {

    const modal =
        document.getElementById("driverModal");

    const input =
        document.getElementById("driverCodeInput");

    const message =
        document.getElementById("driverMessage");

    input.value = "";

    message.textContent = "";

    modal.style.display = "flex";

    setTimeout(() => {
        input.focus();
    }, 100);

}


function closeDriverRegistration() {

    document.getElementById("driverModal")
        .style.display = "none";

}


// =========================
// التحقق من رمز المندوب
// =========================

async function registerAsDriver() {

    const input =
        document.getElementById("driverCodeInput");

    const message =
        document.getElementById("driverMessage");

    const button =
        document.getElementById("driverRegisterButton");


    const code =
        input.value.trim();


    if (!code) {

        message.textContent =
            "اكتب الرمز السري للمندوب";

        message.style.color =
            "#e05265";

        return;
    }


    button.disabled = true;

    button.textContent =
        "جاري التحقق...";

    message.textContent = "";


    try {

        // =========================
        // المستخدم الحالي
        // =========================

        const {
            data: { user },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            message.textContent =
                "يجب تسجيل الدخول أولاً";

            message.style.color =
                "#e05265";

            return;
        }


        // =========================
        // البحث عن المندوب
        // =========================

        const {
            data: driver,
            error: driverError
        } =
            await supabaseClient
                .from("drivers")
                .select(`
       id,
       driver_number,
       name,
       secret_code
     `)
   .eq("secret_code", code)
   .maybeSingle();

        if (driverError) {

            console.error(
                "Driver Error:",
                driverError
            );

            message.textContent =
                "حدث خطأ أثناء التحقق من الرمز";

            message.style.color =
                "#e05265";

            return;
        }


        // =========================
        // الرمز غير صحيح
        // =========================

        if (!driver) {

            message.textContent =
                "الرمز السري غير صحيح";

            message.style.color =
                "#e05265";

            return;
        }


        // =========================
        // حفظ المندوب في بيانات المستخدم
        // =========================

        const {
            error: updateError
        } =
            await supabaseClient.auth.updateUser({

                data: {

                    is_driver: true,

                    driver_id: driver.id,

                    driver_name: driver.name,

                    driver_number:
                        driver.driver_number

                }

            });


        if (updateError) {

            console.error(updateError);

            message.textContent =
                "حدث خطأ أثناء حفظ بيانات المندوب";

            message.style.color =
                "#e05265";

            return;
        }


        // =========================
        // نجاح
        // =========================

        message.textContent =
            `تم التسجيل كمندوب ${driver.name} ✅`;

        message.style.color =
            "#2e9d69";


        setTimeout(() => {

            window.location.href =
                "driver.html";

        }, 700);

    }

    catch (error) {

        console.error(
            "Driver Registration Error:",
            error
        );

        message.textContent =
            "حدث خطأ غير متوقع";

        message.style.color =
            "#e05265";

    }

    finally {

        button.disabled = false;

        button.textContent =
            "تسجيل";

    }

}

loadProfile();


</script>
<div
    id="driverModal"
    style="
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.45);
        z-index:9999;
        align-items:center;
        justify-content:center;
        padding:20px;
    "
>

    <div
        style="
            width:min(420px,100%);
            background:white;
            border-radius:25px;
            padding:25px;
            text-align:right;
            box-shadow:0 20px 60px rgba(0,0,0,.2);
        "
    >

        <h2 style="font-size:20px;font-weight:800;">
            🚚 التسجيل كمندوب
        </h2>

        <p
            style="
                color:#858796;
                font-size:12px;
                margin-top:7px;
            "
        >
            أدخل الرمز السري الخاص بك للتسجيل كمندوب
        </p>

        <input
            id="driverCodeInput"
            type="text"
            placeholder="أدخل الرمز السري"
            autocomplete="off"
            style="
                width:100%;
                height:52px;
                margin-top:18px;
                border:1px solid #e5e5ef;
                border-radius:15px;
                padding:0 15px;
                font-family:inherit;
                font-size:14px;
                outline:none;
            "
        >

        <div
            id="driverMessage"
            style="
                font-size:12px;
                margin-top:10px;
                min-height:20px;
            "
        ></div>

        <div
            style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:10px;
                margin-top:15px;
            "
        >

            <button
                onclick="closeDriverRegistration()"
                style="
                    height:50px;
                    border:none;
                    border-radius:15px;
                    background:#f3f3f7;
                    font-family:inherit;
                    font-weight:800;
                    cursor:pointer;
                "
            >
                إلغاء
            </button>

            <button
                id="driverRegisterButton"
                onclick="registerAsDriver()"
                style="
                    height:50px;
                    border:none;
                    border-radius:15px;
                    background:#6557ed;
                    color:white;
                    font-family:inherit;
                    font-weight:800;
                    cursor:pointer;
                "
            >
                تسجيل
            </button>

        </div>

    </div>

</div>


<div id="passwordModal" class="password-modal" role="dialog" aria-modal="true" aria-labelledby="passwordModalTitle">
    <div class="password-dialog">
        <h2 id="passwordModalTitle">🔒 تغيير كلمة المرور</h2>
        <p>اكتب كلمة مرور جديدة لحسابك ثم أكدها.</p>
        <input id="newPasswordInput" type="password" autocomplete="new-password" placeholder="كلمة المرور الجديدة">
        <input id="confirmPasswordInput" type="password" autocomplete="new-password" placeholder="تأكيد كلمة المرور الجديدة">
        <div id="passwordChangeMessage" class="password-message" aria-live="polite"></div>
        <div class="password-actions">
            <button type="button" class="password-cancel" onclick="closePasswordChange()">إلغاء</button>
            <button id="savePasswordButton" type="button" class="password-save" onclick="saveNewPassword()">حفظ كلمة المرور</button>
        </div>
    </div>
</div>

<script src="./no-zoom.js"></script>



</body>

</html>
