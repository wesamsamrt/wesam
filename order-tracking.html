e:13px}.timeline-row.done .timeline-dot{border-color:#19bd67;background:#0c603a;color:#fff}.timeline-row.current .timeline-dot{border-color:#58a1ff;background:#1265dc;box-shadow:0 0 14px #1976ff;color:#fff}.invoice{padding:0 17px 17px}.invoice-item{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(113,161,245,.15)}.invoice-item img,.fallback{width:72px;height:72px;object-fit:contain;display:grid;place-items:center;flex-shrink:0;border-radius:8px;background:#fff}.invoice-info{flex:1}.invoice-info strong{display:block;font-size:13px}.invoice-info small{display:block;margin-top:3px;color:#a7bddf;font-size:11px}.invoice-price{color:#e9f3ff;font-size:12px}.totals{margin-top:12px;padding-top:10px;border-top:1px solid rgba(113,161,245,.25)}.total-row{display:flex;justify-content:space-between;margin:8px 0;color:#b7c9e4;font-size:13px}.total-row.final{padding-top:12px;border-top:1px solid rgba(113,161,245,.2);color:#fff;font-size:17px;font-weight:800}.total-row.final strong{color:#2580ff;font-size:22px}.error{padding:55px;text-align:center;color:#aac0df}@media(max-width:980px){.content-grid{grid-template-columns:1fr}.details-row{grid-template-columns:repeat(2,1fr)}.detail:nth-child(2){border:0}}@media(max-width:600px){.page{width:calc(100% - 20px);margin-top:10px}.top img{width:115px}.heading h1{font-size:24px}.tracker{padding:16px 7px}.stage-icon{width:42px;height:42px;font-size:18px}.stages:before{top:21px}.stage strong{font-size:10px}.stage small{font-size:8px}.content-grid{gap:11px}.details-row{grid-template-columns:1fr 1fr}.warehouse-map{grid-template-columns:1fr}.map-art{min-height:80px}.timeline-row{grid-template-columns:75px 1fr 30px}.invoice-item img,.fallback{width:58px;height:58px}}
