<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>صفحة المندوب</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: "Cairo", sans-serif;

            background: #f8f9fd;

            color: #171827;

            min-height: 100vh;

            padding-bottom: 40px;

        }


        .page {

            width: min(700px, calc(100% - 30px));

            margin: auto;

        }


        /* =========================
           الهيدر
        ========================= */

        .header {

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 22px 0;

        }


        .back-button {

            width: 46px;

            height: 46px;

            border: none;

            border-radius: 15px;

            background: white;

            box-shadow:
                0 8px 25px rgba(50,50,100,.07);

            font-size: 22px;

            cursor: pointer;

        }


        .header-info {

            flex: 1;

        }


        .header h1 {

            font-size: 22px;

            font-weight: 800;

        }


        .header p {

            color: #858796;

            font-size: 11px;

        }


        /* =========================
           بطاقة تسجيل المندوب
        ========================= */

        .login-card {

            background: white;

            border-radius: 25px;

            padding: 35px 25px;

            text-align: center;

            box-shadow:
                0 8px 25px rgba(50,50,100,.05);

            margin-top: 20px;

        }


        .login-icon {

            width: 80px;

            height: 80px;

            margin: auto;

            border-radius: 25px;

            background: #eeeaff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

            margin-bottom: 18px;

        }


        .login-card h2 {

            font-size: 21px;

            font-weight: 800;

        }


        .login-card p {

            margin-top: 7px;

            color: #858796;

            font-size: 12px;

        }


        .code-input {

            width: 100%;

            height: 55px;

            margin-top: 22px;

            border: 1px solid #e4e5ef;

            border-radius: 16px;

            padding: 0 16px;

            font-family: inherit;

            font-size: 15px;

            font-weight: 700;

            text-align: center;

            outline: none;

            direction: ltr;

        }


        .code-input:focus {

            border-color: #6557ed;

            box-shadow:
                0 0 0 3px rgba(101,87,237,.10);

        }


        .login-button {

            width: 100%;

            height: 53px;

            margin-top: 12px;

            border: none;

            border-radius: 16px;

            background: #6557ed;

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

        }


        .login-button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        .login-message {

            margin-top: 12px;

            font-size: 12px;

            font-weight: 700;

        }


        /* =========================
           معلومات المندوب
        ========================= */

        .driver-header {

            background: white;

            border-radius: 25px;

            padding: 22px;

            box-shadow:
                0 8px 25px rgba(50,50,100,.05);

            display: flex;

            align-items: center;

            gap: 15px;

        }


        .driver-avatar {

            width: 65px;

            height: 65px;

            flex-shrink: 0;

            border-radius: 20px;

            background: #eeeaff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

        }


        .driver-info {

            flex: 1;

        }


        .driver-info h2 {

            font-size: 18px;

            font-weight: 800;

        }


        .driver-info p {

            color: #858796;

            font-size: 11px;

            margin-top: 3px;

        }


        .driver-number {

            direction: ltr;

            text-align: right;

        }


        .logout-driver {

            border: none;

            background: #fff0f3;

            color: #ff4d67;

            border-radius: 13px;

            padding: 9px 12px;

            font-family: inherit;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;

        }


        /* =========================
           الإحصائيات
        ========================= */

        .stats {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 12px;

            margin-top: 15px;

        }


        .stat-card {

            background: white;

            border-radius: 19px;

            padding: 18px;

            box-shadow:
                0 8px 25px rgba(50,50,100,.05);

        }


        .stat-icon {

            font-size: 24px;

        }


        .stat-card span {

            display: block;

            margin-top: 7px;

            color: #858796;

            font-size: 10px;

        }


        .stat-card strong {

            display: block;

            margin-top: 2px;

            font-size: 20px;

            font-weight: 800;

        }


        /* =========================
           عنوان الطلبات
        ========================= */

        .orders-title {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 25px 2px 12px;

        }


        .orders-title h2 {

            font-size: 18px;

            font-weight: 800;

        }


        .refresh-button {

            border: none;

            background: white;

            border-radius: 12px;

            padding: 8px 12px;

            font-family: inherit;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(50,50,100,.05);

        }


        /* =========================
           كرت الطلب
        ========================= */

        .order-card {

            background: white;

            border-radius: 24px;

            padding: 20px;

            margin-bottom: 15px;

            box-shadow:
                0 8px 25px rgba(50,50,100,.05);

        }


        .order-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 10px;

            padding-bottom: 15px;

            border-bottom: 1px solid #f0f0f5;

        }


        .order-number {

            font-size: 17px;

            font-weight: 800;

        }


        .order-date {

            color: #858796;

            font-size: 10px;

            margin-top: 3px;

        }


        .status {

            padding: 6px 10px;

            border-radius: 10px;

            background: #eeeaff;

            color: #6557ed;

            font-size: 10px;

            font-weight: 800;

            white-space: nowrap;

        }


        /* =========================
           بيانات العميل
        ========================= */

        .customer-info {

            padding: 15px 0;

            border-bottom: 1px solid #f0f0f5;

        }


        .customer-name {

            font-size: 15px;

            font-weight: 800;

        }


        .customer-phone {

            margin-top: 5px;

            color: #858796;

            font-size: 11px;

            direction: ltr;

            text-align: right;

        }


        .map-button {

            display: inline-block;

            margin-top: 10px;

            padding: 8px 12px;

            background: #eeeaff;

            color: #6557ed;

            border-radius: 11px;

            text-decoration: none;

            font-size: 11px;

            font-weight: 800;

        }


        .no-location {

            display: inline-block;

            margin-top: 8px;

            color: #999;

            font-size: 10px;

        }


        /* =========================
           المنتجات
        ========================= */

        .products-title {

            font-size: 13px;

            font-weight: 800;

            margin: 15px 0 10px;

        }


        .product-item {

            background: #f8f9fd;

            border-radius: 16px;

            padding: 13px;

            margin-bottom: 9px;

            display: flex;

            gap: 12px;

            align-items: center;

        }


        .product-image {

            width: 55px;

            height: 55px;

            border-radius: 13px;

            background: #eeeaff;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            flex-shrink: 0;

            font-size: 24px;

        }


        .product-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .product-info {

            flex: 1;

            min-width: 0;

        }


        .product-name {

            font-size: 13px;

            font-weight: 800;

        }


        .product-details {

            margin-top: 4px;

            color: #858796;

            font-size: 10px;

            line-height: 1.8;

        }


        .product-quantity {

            margin-top: 3px;

            color: #6557ed;

            font-size: 11px;

            font-weight: 800;

        }


        .product-price {

            font-size: 12px;

            font-weight: 800;

            white-space: nowrap;

        }


        /* =========================
           الإجمالي
        ========================= */

        .order-bottom {

            margin-top: 15px;

            padding-top: 15px;

            border-top: 1px solid #f0f0f5;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .total-label {

            color: #858796;

            font-size: 11px;

        }


        .total-price {

            font-size: 18px;

            font-weight: 800;

        }


        /* =========================
           تحميل
        ========================= */

        .loading {

            text-align: center;

            padding: 60px 20px;

            color: #858796;

            font-size: 12px;

        }


        .loading-icon {

            font-size: 40px;

            margin-bottom: 10px;

        }


        /* =========================
           لا توجد طلبات
        ========================= */

        .empty {

            background: white;

            border-radius: 22px;

            padding: 50px 20px;

            text-align: center;

            box-shadow:
                0 8px 25px rgba(50,50,100,.05);

        }


        .empty-icon {

            font-size: 45px;

            margin-bottom: 10px;

        }


        .empty h3 {

            font-size: 17px;

            font-weight: 800;

        }


        .empty p {

            margin-top: 6px;

            color: #858796;

            font-size: 11px;

        }


        /* =========================
           خطأ
        ========================= */

        .error {

            background: #fff0f3;

            color: #e05265;

            padding: 15px;

            border-radius: 15px;

            text-align: center;

            font-size: 12px;

            font-weight: 700;

        }


        @media (max-width: 500px) {

            .order-top {

                flex-direction: column;

            }

            .status {

                align-self: flex-start;

            }

            .product-item {

                align-items: flex-start;

            }

            .product-price {

                font-size: 11px;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- الهيدر -->

    <header class="header">

        <button
            class="back-button"
            onclick="history.back()"
        >
            →
        </button>


        <div class="header-info">

            <h1>
                🚚 صفحة المندوب
            </h1>

            <p>
                إدارة الطلبات المسندة إليك
            </p>

        </div>

    </header>


    <!-- المحتوى -->

    <main id="content">

        <div class="loading">

            <div class="loading-icon">
                🚚
            </div>

            جاري التحميل...

        </div>

    </main>


</div>



<script>


/* =========================================================
   المتغيرات
========================================================= */

let currentDriver = null;


/* =========================================================
   عناصر الصفحة
========================================================= */

const content =
    document.getElementById("content");


/* =========================================================
   حماية HTML
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   تسجيل المندوب
========================================================= */

function showDriverLogin() {

    content.innerHTML = `

        <div class="login-card">

            <div class="login-icon">
                🚚
            </div>


            <h2>
                تسجيل ك مندوب
            </h2>


            <p>
                أدخل الرمز السري الخاص بك للدخول إلى صفحة المندوب
            </p>


            <input
                id="driverCode"
                class="code-input"
                type="text"
                placeholder="أدخل رمز المندوب"
                autocomplete="off"
            >


            <button
                id="driverLoginButton"
                class="login-button"
                onclick="loginDriver()"
            >
                تسجيل الدخول
            </button>


            <div
                id="driverLoginMessage"
                class="login-message"
            ></div>

        </div>

    `;


    const input =
        document.getElementById("driverCode");


    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                loginDriver();

            }

        }
    );

}


/* =========================================================
   التحقق من رمز المندوب
========================================================= */

async function loginDriver() {

    const input =
        document.getElementById("driverCode");

    const button =
        document.getElementById("driverLoginButton");

    const message =
        document.getElementById("driverLoginMessage");


    const code =
        input.value.trim();


    if (!code) {

        message.textContent =
            "اكتب رمز المندوب";

        message.style.color =
            "#e05265";

        return;

    }


    button.disabled = true;

    button.textContent =
        "جاري التحقق...";


    message.textContent = "";


    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("drivers")
            .select(`
                id,
                driver_number,
                name,
                secret_code
            `)
            .eq("secret_code", code)
            .maybeSingle();


        if (error) {

            console.error(error);

            message.textContent =
                "حدث خطأ أثناء التحقق";

            message.style.color =
                "#e05265";

            button.disabled = false;

            button.textContent =
                "تسجيل الدخول";

            return;

        }


        if (!data) {

            message.textContent =
                "رمز المندوب غير صحيح";

            message.style.color =
                "#e05265";

            button.disabled = false;

            button.textContent =
                "تسجيل الدخول";

            return;

        }


        /* حفظ بيانات المندوب */

        currentDriver = data;


        localStorage.setItem(
            "loggedDriver",
            JSON.stringify({
                id: data.id,
                driver_number: data.driver_number,
                name: data.name
            })
        );


        await showDriverPage();

    }

    catch (error) {

        console.error(error);

        message.textContent =
            "حدث خطأ غير متوقع";

        message.style.color =
            "#e05265";

        button.disabled = false;

        button.textContent =
            "تسجيل الدخول";

    }

}


/* =========================================================
   تحميل المندوب المحفوظ
========================================================= */

function getSavedDriver() {

    try {

        const saved =
            localStorage.getItem(
                "loggedDriver"
            );


        if (!saved) {

            return null;

        }


        return JSON.parse(saved);

    }

    catch (error) {

        console.error(error);

        localStorage.removeItem(
            "loggedDriver"
        );

        return null;

    }

}


/* =========================================================
   عرض صفحة المندوب
========================================================= */

async function showDriverPage() {

    if (!currentDriver) {

        showDriverLogin();

        return;

    }


    content.innerHTML = `

        <section class="driver-header">

            <div class="driver-avatar">
                🚚
            </div>


            <div class="driver-info">

                <h2>
                    ${escapeHtml(currentDriver.name)}
                </h2>

                <p>
                    رقم المندوب:
                    <span class="driver-number">
                        ${escapeHtml(currentDriver.driver_number)}
                    </span>
                </p>

            </div>


            <button
                class="logout-driver"
                onclick="logoutDriver()"
            >
                خروج
            </button>

        </section>


        <section class="stats">

            <div class="stat-card">

                <div class="stat-icon">
                    📦
                </div>

                <span>
                    عدد الطلبات
                </span>

                <strong id="ordersCount">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    💰
                </div>

                <span>
                    إجمالي الطلبات
                </span>

                <strong id="ordersTotal">
                    0 ر.س
                </strong>

            </div>

        </section>


        <div class="orders-title">

            <h2>
                الطلبات المسندة إليك
            </h2>


            <button
                class="refresh-button"
                onclick="loadDriverOrders()"
            >
                🔄 تحديث
            </button>

        </div>


        <div id="driverOrders">

            <div class="loading">

                <div class="loading-icon">
                    📦
                </div>

                جاري تحميل الطلبات...

            </div>

        </div>

    `;


    await loadDriverOrders();

}


/* =========================================================
   تحميل طلبات المندوب
========================================================= */

async function loadDriverOrders() {

    const ordersContainer =
        document.getElementById(
            "driverOrders"
        );


    if (!ordersContainer) return;


    ordersContainer.innerHTML = `

        <div class="loading">

            <div class="loading-icon">
                📦
            </div>

            جاري تحميل الطلبات...

        </div>

    `;


    try {

        /*
         * نجيب الطلبات التي driver_number
         * فيها يساوي رقم المندوب الحالي
         */

        const {
            data: orders,
            error
        } = await supabaseClient
            .from("orders")
            .select(`
                id,
                status,
                customer_name,
                customer_phone,
                customer_lat,
                customer_lng,
                total,
                created_at,
                driver_number
            `)
            .eq(
                "driver_number",
                currentDriver.driver_number
            )
            .order(
                "id",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Driver Orders Error:",
                error
            );


            ordersContainer.innerHTML = `

                <div class="error">

                    حدث خطأ أثناء تحميل الطلبات:

                    <br>

                    ${escapeHtml(error.message)}

                </div>

            `;

            return;

        }


        if (!orders || orders.length === 0) {

            updateStats([]);

            ordersContainer.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📭
                    </div>

                    <h3>
                        لا توجد طلبات
                    </h3>

                    <p>
                        لا توجد حالياً طلبات مسندة إلى رقمك
                    </p>

                </div>

            `;

            return;

        }


        updateStats(orders);


        ordersContainer.innerHTML = "";


        /*
         * لكل طلب:
         * نجيب المنتجات الموجودة في order_items
         */

        for (const order of orders) {

            await renderDriverOrder(
                order,
                ordersContainer
            );

        }

    }

    catch (error) {

        console.error(error);


        ordersContainer.innerHTML = `

            <div class="error">

                حدث خطأ غير متوقع أثناء تحميل الطلبات

            </div>

        `;

    }

}


/* =========================================================
   إحصائيات
========================================================= */

function updateStats(orders) {

    const count =
        document.getElementById(
            "ordersCount"
        );


    const total =
        document.getElementById(
            "ordersTotal"
        );


    if (!count || !total) return;


    count.textContent =
        orders.length;


    const totalAmount =
        orders.reduce(
            (sum, order) => {

                return sum +
                    Number(order.total || 0);

            },
            0
        );


    total.textContent =
        totalAmount.toFixed(2) + " ر.س";

}


/* =========================================================
   عرض طلب واحد
========================================================= */

async function renderDriverOrder(
    order,
    container
) {

    /*
     * جلب منتجات الطلب
     */

    const {
        data: items,
        error
    } = await supabaseClient
        .from("order_items")
        .select(`
            id,
            category,
            product_type,
            type,
            company,
            model,
            color,
            quantity,
            price,
            image
        `)
        .eq(
            "order_id",
            order.id
        )
        .order(
            "id",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Order Items Error:",
            error
        );

        return;

    }


    const card =
        document.createElement("div");


    card.className =
        "order-card";


    const date =
        order.created_at
            ?
            new Date(
                order.created_at
            ).toLocaleString(
                "ar-SA",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            )
            :
            "-";


    /* =========================
       الموقع
    ========================= */

    let locationHTML = "";


    if (
        order.customer_lat !== null &&
        order.customer_lat !== undefined &&
        order.customer_lng !== null &&
        order.customer_lng !== undefined
    ) {

        const lat =
            encodeURIComponent(
                order.customer_lat
            );


        const lng =
            encodeURIComponent(
                order.customer_lng
            );


        locationHTML = `

            <a
                href="https://www.google.com/maps?q=${lat},${lng}"
                target="_blank"
                rel="noopener noreferrer"
                class="map-button"
            >
                🗺️ فتح موقع العميل
            </a>

        `;

    }

    else {

        locationHTML = `

            <span class="no-location">
                📍 لم يتم تحديد موقع العميل
            </span>

        `;

    }


    /* =========================
       المنتجات
    ========================= */

    let productsHTML = "";


    if (!items || items.length === 0) {

        productsHTML = `

            <div class="no-location">
                لا توجد منتجات لهذا الطلب
            </div>

        `;

    }

    else {

        items.forEach(item => {

            const quantity =
                Number(
                    item.quantity || 1
                );


            const price =
                Number(
                    item.price || 0
                );


            const itemTotal =
                quantity * price;


            const details = [];


            if (item.category)
                details.push(
                    "التصنيف: " +
                    item.category
                );


            if (item.product_type)
                details.push(
                    "نوع المنتج: " +
                    item.product_type
                );


            if (item.type)
                details.push(
                    "النوع: " +
                    item.type
                );


            if (item.company)
                details.push(
                    "الشركة: " +
                    item.company
                );


            if (item.color)
                details.push(
                    "اللون: " +
                    item.color
                );


            const detailsHTML =
                details
                    .map(
                        detail =>
                            escapeHtml(detail)
                    )
                    .join(" • ");


            productsHTML += `

                <div class="product-item">

                    <div class="product-image">

                        ${
                            item.image
                            ?
                            `
                            <img
                                src="${escapeHtml(item.image)}"
                                alt=""
                            >
                            `
                            :
                            "📦"
                        }

                    </div>


                    <div class="product-info">

                        <div class="product-name">

                            ${escapeHtml(
                                item.model ||
                                "بدون موديل"
                            )}

                        </div>


                        <div class="product-details">

                            ${detailsHTML || "بدون تفاصيل إضافية"}

                        </div>


                        <div class="product-quantity">

                            الكمية:
                            ${quantity}

                        </div>

                    </div>


                    <div class="product-price">

                        ${itemTotal.toFixed(2)}
                        ر.س

                    </div>

                </div>

            `;

        });

    }


    /* =========================
       بناء الطلب
    ========================= */

    card.innerHTML = `

        <div class="order-top">

            <div>

                <div class="order-number">

                    الطلب #${order.id}

                </div>


                <div class="order-date">

                    ${escapeHtml(date)}

                </div>

            </div>


            <div class="status">

                ${escapeHtml(
                    order.status ||
                    "جديد"
                )}

            </div>

        </div>


        <div class="customer-info">

            <div class="customer-name">

                👤
                ${escapeHtml(
                    order.customer_name ||
                    "بدون اسم"
                )}

            </div>


            <div class="customer-phone">

                📱
                ${escapeHtml(
                    order.customer_phone ||
                    "لا يوجد رقم"
                )}

            </div>


            ${locationHTML}

        </div>


        <div class="products-title">

            📦 منتجات الطلب

        </div>


        <div>

            ${productsHTML}

        </div>


        <div class="order-bottom">

            <span class="total-label">

                إجمالي الطلب

            </span>


            <strong class="total-price">

                ${Number(
                    order.total || 0
                ).toFixed(2)}

                ر.س

            </strong>

        </div>

    `;


    container.appendChild(card);

}


/* =========================================================
   تسجيل خروج المندوب
========================================================= */

function logoutDriver() {

    const confirmed =
        confirm(
            "هل تريد تسجيل الخروج من حساب المندوب؟"
        );


    if (!confirmed) return;


    localStorage.removeItem(
        "loggedDriver"
    );


    currentDriver = null;


    showDriverLogin();

}


/* =========================================================
   تشغيل الصفحة
========================================================= */

async function initDriverPage() {

    const savedDriver =
        getSavedDriver();


    if (!savedDriver) {

        showDriverLogin();

        return;

    }


    /*
     * نتحقق أن المندوب ما زال موجوداً
     */

    const {
        data,
        error
    } = await supabaseClient
        .from("drivers")
        .select(`
            id,
            driver_number,
            name
        `)
        .eq(
            "id",
            savedDriver.id
        )
        .maybeSingle();


    if (error || !data) {

        localStorage.removeItem(
            "loggedDriver"
        );


        showDriverLogin();

        return;

    }


    currentDriver = data;


    await showDriverPage();

}


/* تشغيل */

initDriverPage();


</script>
