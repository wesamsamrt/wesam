  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,Arial,sans-serif;color:#eaf1ff;background:radial-gradient(circle at 88% 5%,#113b83 0,transparent 26%),radial-gradient(circle at 10% 70%,#0a2962 0,transparent 25%),#020d24}.page{width:min(980px,calc(100% - 28px));margin:24px auto 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 18px;border:1px solid rgba(75,139,242,.55);border-radius:21px;background:linear-gradient(125deg,rgba(8,27,67,.96),rgba(4,16,42,.9))}.top img{width:118px;height:45px;object-fit:contain}.back{padding:9px 13px;border:1px solid rgba(105,164,255,.42);border-radius:11px;background:#0b2557;color:#dce9ff;text-decoration:none;font-weight:800;font-size:12px}h1{margin:26px 0 7px;font-size:25px}.intro{margin:0 0 18px;color:#9eb1d5;font-size:13px}.order{margin-top:13px;padding:18px;border:1px solid rgba(105,164,255,.28);border-radius:18px;background:linear-gradient(145deg,rgba(15,43,91,.92),rgba(5,19,49,.96));box-shadow:0 14px 30px rgba(0,0,0,.2)}.order-head,.item{display:flex;align-items:center;justify-content:space-between;gap:13px}.order h2{margin:0;font-size:17px}.date,.meta{margin:4px 0 0;color:#9eb1d5;font-size:11px}.status{padding:6px 10px;border-radius:999px;background:rgba(39,128,255,.19);border:1px solid rgba(105,164,255,.28);color:#9bc8ff;font-size:11px;font-weight:800}.items{margin-top:15px;border-top:1px solid rgba(113,161,245,.16)}.item{padding:11px 0;border-bottom:1px solid rgba(113,161,245,.13)}.item img,.fallback{width:52px;height:52px;object-fit:contain;display:grid;place-items:center;flex-shrink:0;border-radius:10px;background:#fff}.item-info{flex:1}.item-info strong{font-size:13px}.item-info span{display:block;margin-top:3px;color:#9eb1d5;font-size:11px}.item-price{color:#74b6ff;font-size:13px;font-weight:800}.total{display:flex;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid rgba(113,161,245,.16);font-size:14px;font-weight:800}.total strong:last-child{color:#74b6ff;font-size:18px}.track-order-button{display:block;margin-top:14px;padding:11px;border:1px solid rgba(105,164,255,.5);border-radius:11px;background:rgba(20,91,234,.24);color:#b9d9ff;text-align:center;text-decoration:none;font-size:12px;font-weight:800}.empty{padding:45px 18px;border:1px solid rgba(105,164,255,.25);border-radius:18px;background:rgba(7,25,60,.8);color:#9eb1d5;text-align:center}@media(max-width:600px){.page{width:calc(100% - 22px);margin-top:12px}.top img{width:94px}.order{padding:14px}}
    .order-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.track-order-button,.edit-invoice-button{display:block;padding:11px;border:1px solid rgba(105,164,255,.5);border-radius:11px;background:rgba(20,91,234,.24);color:#b9d9ff;text-align:center;text-decoration:none;font:800 12px Cairo,Arial,sans-serif}.edit-invoice-button{background:rgba(35,164,110,.19);border-color:rgba(101,221,160,.45);color:#b8f4d1;cursor:pointer}.edit-invoice-button.disabled{background:rgba(137,150,178,.12);border-color:rgba(160,174,205,.2);color:#9eabc4;cursor:not-allowed}@media(max-width:600px){.order-actions{grid-template-columns:1fr}}
