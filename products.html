<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>حماية شاشة</title>


    <!-- الخط -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="products.css"
    >


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <button
            class="back-button"
            onclick="history.back()"
        >
            →
        </button>


        <div class="header-title">

    <h1 id="pageTitle">
        جاري التحميل...
    </h1>

    <p id="pageDescription">
        جاري التحميل...
    </p>

</div>

    </header>



    <!-- =========================
         SEARCH
    ========================== -->

    <div class="search">

        <div class="search-box">

            <span>
                ⌕
            </span>

            <input
                id="searchInput"
                type="text"
                placeholder="ابحث عن موديل مثل iPhone 15..."
                oninput="searchProducts()"
            >

        </div>

    </div>



    <!-- =========================
         FILTERS
    ========================== -->

    <div class="filters">

        <button
            class="filter active"
        >
            الكل
        </button>

        <button class="filter">
            قزاز عادي
        </button>

        <button class="filter">
            خصوصية
        </button>

        <button class="filter">
            21D
        </button>

        <button class="filter">
            مات
        </button>

    </div>



    <!-- =========================
         PRODUCTS
    ========================== -->

    <main class="content">

        <div class="section-title">

            <h2>
                المنتجات
            </h2>

            <span>
                من المخزون
            </span>

        </div>


        <!--
            المنتجات ستأتي من Supabase
            عن طريق products.js
        -->

        <div
            class="products"
            id="products"
        ></div>

    </main>



    <!-- JavaScript -->


<!-- =========================
     نافذة تفاصيل المنتج
========================= -->

<div
    id="productModal"
    style="
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.55);
        z-index:9999;
        align-items:center;
        justify-content:center;
        padding:20px;
    "
>

    <div
        id="productModalContent"
        style="
            width:min(500px, 100%);
            max-height:90vh;
            overflow-y:auto;
            background:white;
            border-radius:28px;
            padding:20px;
            position:relative;
        "
    >

        <button
            onclick="closeProductModal()"
            style="
                position:absolute;
                top:12px;
                left:12px;
                width:40px;
                height:40px;
                border:none;
                border-radius:12px;
                background:#f1f1f1;
                font-size:20px;
                cursor:pointer;
                z-index:2;
            "
        >
            ✕
        </button>


        <div id="productModalBody">

        </div>

    </div>

</div>




    <script src="products.js"></script>



<script>
    const params = new URLSearchParams(window.location.search);

    const productType = params.get("type");

    if (productType) {
        document.getElementById("pageTitle").textContent =
            "📦 " + productType;

        document.getElementById("pageDescription").textContent =
            "اختر المنتج المناسب";
    } else {
        document.getElementById("pageTitle").textContent =
            "🛍️ المنتجات";

        document.getElementById("pageDescription").textContent =
            "اختر المنتج المناسب";
    }
</script>



<!-- =========================
     نافذة تفاصيل المنتج
========================= -->

<div id="productModal" class="product-modal">

    <div class="product-modal-box">

        <button
            class="product-modal-close"
            onclick="closeProductModal()"
        >
            ×
        </button>

        <div
            id="modalProductImage"
            class="modal-product-image"
        ></div>

        <div class="modal-product-content">

            <div
                id="modalProductType"
                class="modal-product-type"
            ></div>

            <h2 id="modalProductName">
                اسم المنتج
            </h2>

            <p
                id="modalProductCompany"
                class="modal-company"
            ></p>

            <p
                id="modalProductDescription"
                class="modal-description"
            ></p>

            <div
                id="modalProductDetails"
                class="modal-details"
            ></div>

            <div
                id="modalColors"
                class="modal-options"
            ></div>

            <div
                id="modalModels"
                class="modal-options"
            ></div>

            <div class="modal-bottom">

                <strong
                    id="modalProductPrice"
                    class="modal-price"
                >
                    0 ر.س
                </strong>

                <button
                    id="modalAddButton"
                    class="modal-add-button"
                >
                    + إضافة للسلة
                </button>

            </div>

        </div>

    </div>

</div>
</body>

</html>
