<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تسجيل الدخول</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ملف Supabase الخاص بك -->
    <script src="supabase.js"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: #f8f9fd;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .login-card {

            width: 100%;
            max-width: 420px;

            background: white;

            border-radius: 28px;

            padding: 30px;

            box-shadow:
                0 15px 40px rgba(50,50,100,.08);
        }


        .icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 22px;

            background: #eeeaff;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 34px;
        }


        h1 {

            text-align: center;

            font-size: 24px;

            font-weight: 800;

            margin-bottom: 7px;
        }


        .description {

            text-align: center;

            color: #858796;

            font-size: 12px;

            margin-bottom: 25px;
        }


        .field {

            margin-bottom: 15px;
        }


        .field label {

            display: block;

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 7px;
        }


        .field input {

            width: 100%;

            height: 52px;

            border: 1px solid #eee;

            border-radius: 15px;

            padding: 0 15px;

            font-family: inherit;

            outline: none;

            font-size: 13px;

            background: white;
        }


        .field input:focus {

            border-color: #6557ed;
        }


        .login-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 15px;

            background: #6557ed;

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 5px;

            transition: .2s;
        }


        .login-button:hover {

            opacity: .92;
        }


        .login-button:disabled {

            opacity: .6;

            cursor: not-allowed;
        }


        /* =========================
           Google Button
        ========================= */

        .google-button {

            width: 100%;

            height: 52px;

            border: 1px solid #e5e5e5;

            border-radius: 15px;

            background: white;

            color: #333;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 10px;

            transition: .2s;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;
        }


        .google-button:hover {

            background: #f8f8f8;
        }


        .google-button:disabled {

            opacity: .6;

            cursor: not-allowed;
        }


        .google-icon {

            width: 22px;

            height: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            font-size: 19px;

            font-weight: bold;
        }


        .register {

            text-align: center;

            margin-top: 20px;

            font-size: 12px;

            color: #858796;
        }


        .register a {

            color: #6557ed;

            font-weight: 800;

            text-decoration: none;
        }


        .message {

            margin-top: 15px;

            padding: 12px;

            border-radius: 12px;

            font-size: 12px;

            text-align: center;

            display: none;
        }


        .message.error {

            background: #fff0f3;

            color: #e33b55;
        }


        .message.success {

            background: #e8f8ef;

            color: #198754;
        }

        .forgot-password-link {
            display: block;
            width: fit-content;
            margin: -6px 0 16px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #6557ed;
            font: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .recovery-panel {
            margin: 18px 0;
            padding: 18px;
            border: 1px solid #dedbff;
            border-radius: 18px;
            background: #f8f7ff;
        }

        .recovery-panel[hidden] { display: none; }
        .recovery-panel h2 { font-size: 16px; margin-bottom: 6px; }
        .recovery-panel p { margin-bottom: 14px; color: #67677a; font-size: 11px; line-height: 1.9; }
        .recovery-actions { display: flex; gap: 8px; margin-top: 10px; }
        .recovery-actions button { flex: 1; }
        .secondary-button {
            min-height: 46px;
            border: 1px solid #d8d5fb;
            border-radius: 13px;
            background: #fff;
            color: #6557ed;
            font: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- الأيقونة -->

    <div class="icon">
        🔐
    </div>


    <!-- العنوان -->

    <h1>
        تسجيل الدخول
    </h1>


    <p class="description">
        سجل دخولك لإضافة المنتجات إلى طلباتك
    </p>


    <!-- =========================
         البريد الإلكتروني
    ========================= -->

    <div class="field">

        <label>
            البريد الإلكتروني
        </label>

        <input
            id="email"
            type="email"
            placeholder="example@email.com"
            autocomplete="email"
        >

    </div>

    <!-- =========================
         كلمة المرور
    ========================= -->

    <div class="field">

        <label>
            كلمة المرور
        </label>

        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >

    </div>

    <button type="button" class="forgot-password-link" onclick="openPasswordRecovery()">
        نسيت كلمة المرور؟
    </button>

    <section class="recovery-panel" id="recoveryPanel" hidden>
        <h2>استعادة كلمة المرور</h2>
        <p id="recoveryHelp">اكتب بريد حسابك وسنرسل لك رمز تحقق من 6 أرقام.</p>

        <div class="field" id="recoveryEmailField">
            <label>البريد الإلكتروني</label>
            <input id="recoveryEmail" type="email" placeholder="example@email.com" autocomplete="email">
        </div>

        <div id="recoveryCodeStep" hidden>
            <div class="field">
                <label>رمز التحقق</label>
                <input id="recoveryCode" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
            </div>
            <button type="button" class="login-button" id="verifyRecoveryCodeButton" onclick="verifyRecoveryCode()">تأكيد الرمز</button>
        </div>

        <div id="recoveryPasswordStep" hidden>
            <div class="field">
                <label>كلمة المرور الجديدة</label>
                <input id="newRecoveryPassword" type="password" minlength="6" placeholder="6 أحرف على الأقل" autocomplete="new-password">
            </div>
            <div class="field">
                <label>تأكيد كلمة المرور الجديدة</label>
                <input id="confirmRecoveryPassword" type="password" minlength="6" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password">
            </div>
            <button type="button" class="login-button" id="saveRecoveryPasswordButton" onclick="saveRecoveredPassword()">حفظ كلمة المرور الجديدة</button>
        </div>

        <div class="recovery-actions">
            <button type="button" class="secondary-button" onclick="closePasswordRecovery()">إلغاء</button>
            <button type="button" class="secondary-button" id="sendRecoveryCodeButton" onclick="sendRecoveryCode()">إرسال الرمز</button>
        </div>
    </section>


    <!-- =========================
         تسجيل الدخول العادي
    ========================= -->

    <button
        class="login-button"
        id="loginButton"
        onclick="login()"
    >
        تسجيل الدخول
    </button>


    <!-- =========================
         Google
    ========================= -->

    <button
        type="button"
        class="google-button"
        id="googleButton"
        onclick="loginWithGoogle()"
    >

        <span class="google-icon">
            G
        </span>

        تسجيل الدخول باستخدام Google

    </button>


    <!-- الرسائل -->

    <div
        class="message"
        id="message"
    ></div>


    <!-- =========================
         الدخول كضيف
    ========================= -->

    <button
        type="button"
        onclick="guestLogin()"
        style="
            width:100%;
            height:52px;
            border:none;
            border-radius:15px;
            background:#f0efff;
            color:#6557ed;
            font-family:inherit;
            font-size:14px;
            font-weight:800;
            cursor:pointer;
            margin-top:10px;
        "
    >
        الدخول كضيف
    </button>


    <!-- =========================
         إنشاء حساب
    ========================= -->

    <div class="register">

        ما عندك حساب؟

        <a href="register.html">
            إنشاء حساب
        </a>

    </div>


</div>



<script>


/* =====================================================
   عرض الرسائل
===================================================== */

function showMessage(text, type = "error") {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";
}

let passwordRecoveryVerified = false;

function getRecoveryElements() {
    return {
        panel: document.getElementById("recoveryPanel"),
        email: document.getElementById("recoveryEmail"),
        emailField: document.getElementById("recoveryEmailField"),
        codeStep: document.getElementById("recoveryCodeStep"),
        passwordStep: document.getElementById("recoveryPasswordStep"),
        help: document.getElementById("recoveryHelp"),
        sendButton: document.getElementById("sendRecoveryCodeButton")
    };
}

function openPasswordRecovery() {
    const elements = getRecoveryElements();
    elements.panel.hidden = false;
    elements.email.value = document.getElementById("email").value.trim().toLowerCase();
    elements.email.focus();
}

function closePasswordRecovery() {
    const elements = getRecoveryElements();
    elements.panel.hidden = true;
    elements.codeStep.hidden = true;
    elements.passwordStep.hidden = true;
    passwordRecoveryVerified = false;
}

async function sendRecoveryCode() {
    const elements = getRecoveryElements();
    const email = elements.email.value.trim().toLowerCase();
    if (!email || !email.includes("@")) {
        showMessage("اكتب بريدًا إلكترونيًا صحيحًا");
        return;
    }

    elements.sendButton.disabled = true;
    elements.sendButton.textContent = "جاري الإرسال...";
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}${window.location.pathname}`
    });
    elements.sendButton.disabled = false;
    elements.sendButton.textContent = "إعادة إرسال الرمز";

    if (error) {
        showMessage("تعذر إرسال رمز الاستعادة، حاول بعد قليل.");
        return;
    }

    // لا نكشف هل البريد مسجل أم لا، لحماية حسابات المستخدمين.
    elements.codeStep.hidden = false;
    elements.help.textContent = "إذا كان البريد مسجلًا، أرسلنا رمز تحقق من 6 أرقام. اكتب الرمز ثم اختر كلمة مرور جديدة.";
    document.getElementById("recoveryCode").focus();
    showMessage("تم إرسال رمز الاستعادة إلى بريدك إذا كان الحساب موجودًا.", "success");
}

async function verifyRecoveryCode() {
    const elements = getRecoveryElements();
    const email = elements.email.value.trim().toLowerCase();
    const token = document.getElementById("recoveryCode").value.trim();
    const button = document.getElementById("verifyRecoveryCodeButton");
    if (!/^\d{6}$/.test(token)) {
        showMessage("اكتب رمز التحقق المكوّن من 6 أرقام.");
        return;
    }

    button.disabled = true;
    button.textContent = "جاري التحقق...";
    const { error } = await supabaseClient.auth.verifyOtp({ email, token, type: "recovery" });
    button.disabled = false;
    button.textContent = "تأكيد الرمز";
    if (error) {
        showMessage("رمز التحقق غير صحيح أو انتهت صلاحيته.");
        return;
    }

    passwordRecoveryVerified = true;
    elements.codeStep.hidden = true;
    elements.passwordStep.hidden = false;
    elements.help.textContent = "تم تأكيد الرمز. اختر كلمة مرور جديدة لحسابك.";
    document.getElementById("newRecoveryPassword").focus();
}

async function saveRecoveredPassword() {
    if (!passwordRecoveryVerified) {
        showMessage("أكد رمز التحقق أولًا.");
        return;
    }
    const password = document.getElementById("newRecoveryPassword").value;
    const confirmation = document.getElementById("confirmRecoveryPassword").value;
    if (password.length < 6) {
        showMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
        return;
    }
    if (password !== confirmation) {
        showMessage("كلمتا المرور غير متطابقتين.");
        return;
    }

    const button = document.getElementById("saveRecoveryPasswordButton");
    button.disabled = true;
    button.textContent = "جاري الحفظ...";
    const { error } = await supabaseClient.auth.updateUser({ password });
    button.disabled = false;
    button.textContent = "حفظ كلمة المرور الجديدة";
    if (error) {
        showMessage("تعذر تغيير كلمة المرور، أعد طلب رمز جديد.");
        return;
    }

    closePasswordRecovery();
    document.getElementById("password").value = "";
    showMessage("تم تغيير كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.", "success");
}



/* =====================================================
   تحويل المستخدم للصفحة المطلوبة
===================================================== */

function goAfterLogin() {

    const redirect =
        sessionStorage.getItem(
            "loginRedirect"
        );


    if (redirect) {

        sessionStorage.removeItem(
            "loginRedirect"
        );


        window.location.href =
            redirect;

    }

    else {

        window.location.href =
            "index.html";

    }

}



/* =====================================================
   تسجيل الدخول بالبريد وكلمة المرور
===================================================== */

async function login() {

    const email =
        document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById("password")
            .value;


    const button =
        document.getElementById(
            "loginButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    message.style.display =
        "none";


    /* التحقق */

    if (!email || !password) {

        showMessage(
            "اكتب البريد الإلكتروني وكلمة المرور"
        );

        return;

    }


    if (!email.includes("@")) {

        showMessage(
            "اكتب بريدًا إلكترونيًا صحيحًا"
        );

        return;

    }


    /* تعطيل الزر */

    button.disabled = true;

    button.textContent =
        "جاري تسجيل الدخول...";


    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        /* الخطأ */

        if (error) {

            console.error(
                "Login Error:",
                error
            );


            let errorMessage =
                "حدث خطأ أثناء تسجيل الدخول";


            if (
                error.message
                    .toLowerCase()
                    .includes(
                        "invalid login credentials"
                    )
            ) {

                errorMessage =
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة";

            }


            else if (
                error.message
                    .toLowerCase()
                    .includes(
                        "email not confirmed"
                    )
            ) {

                errorMessage =
                    "يجب تأكيد البريد الإلكتروني أولًا";

            }


            else if (
                error.message
                    .toLowerCase()
                    .includes(
                        "too many requests"
                    )
            ) {

                errorMessage =
                    "محاولات كثيرة، حاول مرة أخرى بعد قليل";

            }


            showMessage(
                errorMessage
            );


            button.disabled =
                false;


            button.textContent =
                "تسجيل الدخول";


            return;

        }


        /* التأكد من المستخدم */

        if (
            !data ||
            !data.user
        ) {

            showMessage(
                "لم يتم العثور على الحساب"
            );


            button.disabled =
                false;


            button.textContent =
                "تسجيل الدخول";


            return;

        }


        console.log(
            "تم تسجيل الدخول:",
            data.user
        );


        showMessage(
            "تم تسجيل الدخول بنجاح",
            "success"
        );


        button.textContent =
            "تم تسجيل الدخول ✓";


        setTimeout(
            function() {

                goAfterLogin();

            },
            700
        );


    }

    catch (error) {

        console.error(
            "Unexpected Login Error:",
            error
        );


        showMessage(
            "حدث خطأ غير متوقع، حاول مرة أخرى"
        );


        button.disabled =
            false;


        button.textContent =
            "تسجيل الدخول";

    }

}



/* =====================================================
   تسجيل الدخول باستخدام Google
===================================================== */

async function loginWithGoogle() {

    const button =
        document.getElementById(
            "googleButton"
        );


    button.disabled =
        true;


    button.innerHTML =
        '<span class="google-icon">G</span> جاري التحويل إلى Google...';


    try {

        const { error } =
            await supabaseClient.auth.signInWithOAuth({

                provider:
                    "google",

                options: {

                    redirectTo:
                        window.location.origin +
                        window.location.pathname

                }

            });


        if (error) {

            console.error(
                "Google Login Error:",
                error
            );


            showMessage(
                "حدث خطأ في تسجيل الدخول باستخدام Google"
            );


            button.disabled =
                false;


            button.innerHTML =
                '<span class="google-icon">G</span> تسجيل الدخول باستخدام Google';

        }

    }

    catch (error) {

        console.error(
            "Unexpected Google Login Error:",
            error
        );


        showMessage(
            "حدث خطأ غير متوقع"
        );


        button.disabled =
            false;


        button.innerHTML =
            '<span class="google-icon">G</span> تسجيل الدخول باستخدام Google';

    }

}



/* =====================================================
   التحقق من جلسة Google بعد الرجوع من Google
===================================================== */

async function checkGoogleLogin() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session Error:",
                error
            );

            return;

        }


        /* إذا كان المستخدم مسجل دخول */

        if (
            data &&
            data.session &&
            data.session.user
        ) {

            console.log(
                "تم العثور على جلسة المستخدم:",
                data.session.user
            );


            showMessage(
                "تم تسجيل الدخول بنجاح",
                "success"
            );


            setTimeout(
                function() {

                    goAfterLogin();

                },
                500
            );

        }

    }

    catch (error) {

        console.error(
            "Google Session Error:",
            error
        );

    }

}



/* =====================================================
   الدخول كضيف
===================================================== */

function guestLogin() {

    window.location.href =
        "index.html";

}



/* =====================================================
   تشغيل فحص جلسة Google
===================================================== */

checkGoogleLogin();


</script>

<script src="./no-zoom.js"></script>


</body>

</html>
