<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات العميل | WESAM SMART</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,Arial,sans-serif;color:#eaf1ff;background:radial-gradient(circle at 88% 5%,#113b83 0,transparent 26%),radial-gradient(circle at 10% 70%,#0a2962 0,transparent 25%),#020d24}.page{width:min(700px,calc(100% - 28px));margin:24px auto 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 18px;border:1px solid rgba(75,139,242,.55);border-radius:21px;background:linear-gradient(125deg,rgba(8,27,67,.96),rgba(4,16,42,.9))}.top img{width:118px;height:45px;object-fit:contain}.back{padding:9px 13px;border:1px solid rgba(105,164,255,.42);border-radius:11px;background:#0b2557;color:#dce9ff;text-decoration:none;font-weight:800;font-size:12px}.panel{margin-top:20px;padding:24px;border:1px solid rgba(105,164,255,.3);border-radius:22px;background:linear-gradient(145deg,rgba(15,43,91,.94),rgba(5,19,49,.98));box-shadow:0 18px 38px rgba(0,0,0,.25)}h1{margin:0;font-size:24px}.intro{margin:7px 0 22px;color:#9eb1d5;font-size:13px;line-height:1.9}.field{margin-top:17px}.field label{display:block;margin-bottom:8px;color:#eaf1ff;font-size:13px;font-weight:800}.field input{width:100%;height:51px;padding:0 14px;border:1px solid rgba(113,161,245,.3);border-radius:13px;background:#061937;color:#eef5ff;font:inherit;outline:none}.field input:focus{border-color:#4e9cff;box-shadow:0 0 0 3px rgba(78,156,255,.13)}.driver-note{margin:9px 0 0;color:#9eb1d5;font-size:11px}.location-button,.submit{width:100%;min-height:52px;border:0;border-radius:13px;font:inherit;font-weight:800;cursor:pointer}.location-button{background:rgba(27,75,150,.46);border:1px solid rgba(105,164,255,.42);color:#dceaff}.location-status{margin-top:10px;padding:12px;border:1px solid rgba(113,161,245,.2);border-radius:12px;background:rgba(6,25,55,.82);color:#9eb1d5;font-size:12px;text-align:center}.submit{margin-top:23px;background:linear-gradient(135deg,#145bea,#548bff);color:#fff;font-size:15px;box-shadow:0 12px 24px rgba(20,91,234,.3)}.submit:disabled{opacity:.6;cursor:not-allowed}.message{margin-top:14px;min-height:18px;color:#ffabb6;font-size:12px;font-weight:700;text-align:center}@media(max-width:600px){.page{width:calc(100% - 22px);margin-top:12px}.panel{padding:18px}.top img{width:94px}}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <main class="page">
        <header class="top"><a class="back" href="orders.html">← العودة للسلة</a><img src="logo.png" alt="WESAM SMART"></header>
        <section class="panel">
            <h1>بيانات العميل</h1>
            <p class="intro">احفظ بيانات الاستلام أولًا. بعد الحفظ ستعود إلى السلة، ومنها يمكنك تقديم الطلب مباشرة.</p>
            <form id="customerDetailsForm">
                <div class="field"><label for="customerName">👤 اسم العميل</label><input id="customerName" required autocomplete="name" placeholder="اكتب اسم العميل"></div>
                <div class="field"><label for="customerPhone">📱 رقم جوال العميل</label><input id="customerPhone" required inputmode="tel" autocomplete="tel" placeholder="05xxxxxxxx"></div>
                <div class="field"><label>📍 عنوان العميل</label><button type="button" class="location-button" onclick="openCustomerMap()">تحديد الموقع من الخريطة</button><div id="locationStatus" class="location-status">لم يتم تحديد الموقع بعد</div></div>
                <div id="formMessage" class="message" aria-live="polite"></div>
                <button id="submitButton" class="submit" type="submit">حفظ عنوان الاستلام</button>
            </form>
        </section>
    </main>
    <script src="customer-details.js?v=20260830"></script>
</body>
</html>
