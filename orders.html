<script>

async function loadOrders() {

    const container = document.getElementById("orders");

    container.innerHTML = `
        <div class="empty">
            جاري تحميل الطلبات...
        </div>
    `;


    // =========================
    // التأكد من تسجيل الدخول
    // =========================

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if (userError || !user) {

        container.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    🔐
                </div>

                <h3>
                    سجل دخولك أولاً
                </h3>

                <p>
                    يجب تسجيل الدخول لعرض السلة
                </p>

                <button
                    onclick="window.location.href='login.html'"
                    style="
                        margin-top:15px;
                        padding:12px 20px;
                        border:none;
                        border-radius:12px;
                        background:#6557ed;
                        color:white;
                        font-family:inherit;
                        font-weight:800;
                        cursor:pointer;
                    "
                >
                    تسجيل الدخول
                </button>

            </div>
        `;

        return;
    }


    // =========================
    // جلب طلب المستخدم
    // =========================

    const {
        data: orders,
        error: ordersError
    } = await supabaseClient
        .from("orders")
        .select("*")
        .eq("user_id", user.id)
        .eq("status", "جديد")
        .order("id", {
            ascending: false
        })
        .limit(1);


    if (ordersError) {

        console.error(ordersError);

        container.innerHTML = `
            <div class="empty">
                حدث خطأ أثناء تحميل الطلبات
            </div>
        `;

        return;
    }


    if (!orders || orders.length === 0) {

        container.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    🛍️
                </div>

                <h3>
                    السلة فارغة
                </h3>

                <p>
                    لم تتم إضافة أي منتجات بعد
                </p>

            </div>
        `;

        return;
    }


    const order = orders[0];


    // =========================
    // جلب المنتجات
    // =========================

    const {
        data: items,
        error: itemsError
    } = await supabaseClient
        .from("order_items")
        .select("*")
        .eq("order_id", order.id)
        .order("id", {
            ascending: true
        });


    if (itemsError) {

        console.error(itemsError);

        container.innerHTML = `
            <div class="empty">
                حدث خطأ أثناء تحميل المنتجات
            </div>
        `;

        return;
    }


    if (!items || items.length === 0) {

        container.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    🛍️
                </div>

                <h3>
                    السلة فارغة
                </h3>

                <p>
                    لم تتم إضافة أي منتجات بعد
                </p>

            </div>
        `;

        return;
    }


    // =========================
    // عرض المنتجات
    // =========================

    container.innerHTML = "";


    items.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "order-card";


        card.innerHTML = `

            <div class="order-image">

                ${
                    item.image
                    ?
                    `<img
                        src="${item.image}"
                        alt="${item.model || ""}"
                    >`
                    :
                    "📱"
                }

            </div>


            <div class="order-info">

                <h3>
                    ${item.model || "بدون موديل"}
                </h3>

                <p>
                    ${
                        item.category
                        ? "التصنيف: " + item.category
                        : ""
                    }
                </p>

                <p>
                    ${
                        item.product_type
                        ? "نوع المنتج: " + item.product_type
                        : ""
                    }
                </p>

                <p>
                    ${
                        item.type
                        ? "النوع: " + item.type
                        : ""
                    }
                </p>

                <p>
                    ${
                        item.company
                        ? "الشركة: " + item.company
                        : ""
                    }
                </p>

                <p>
                    ${
                        item.color
                        ? "اللون: " + item.color
                        : ""
                    }
                </p>

                <div class="price">
                    ${item.price ?? 0} ر.س
                </div>


                <div style="
                    display:flex;
                    align-items:center;
                    gap:8px;
                    margin-top:10px;
                ">

                    <button
                        onclick="changeQuantity(${item.id}, -1)"
                        style="
                            width:30px;
                            height:30px;
                            border:none;
                            border-radius:10px;
                            background:#eeeaff;
                            color:#6557ed;
                            font-size:18px;
                            cursor:pointer;
                        "
                    >
                        −
                    </button>

                    <strong>
                        ${item.quantity || 1}
                    </strong>

                    <button
                        onclick="changeQuantity(${item.id}, 1)"
                        style="
                            width:30px;
                            height:30px;
                            border:none;
                            border-radius:10px;
                            background:#6557ed;
                            color:white;
                            font-size:18px;
                            cursor:pointer;
                        "
                    >
                        +
                    </button>

                </div>

            </div>


            <button
                class="delete-button"
                onclick="removeOrderItem(${item.id})"
            >
                🗑️
            </button>

        `;


        container.appendChild(card);

    });


    // =========================
    // الإجمالي
    // =========================

    const totalBox =
        document.createElement("div");

    totalBox.style.cssText = `
        background:white;
        border-radius:22px;
        padding:20px;
        margin-top:15px;
        box-shadow:0 8px 25px rgba(50,50,100,.05);
        display:flex;
        justify-content:space-between;
        align-items:center;
    `;


    totalBox.innerHTML = `

        <strong>
            إجمالي الطلب
        </strong>

        <strong style="
            color:#6557ed;
            font-size:18px;
        ">
            ${order.total ?? 0} ر.س
        </strong>

    `;


    container.appendChild(totalBox);

}

// حذف منتج
// =========================

async function removeOrderItem(itemId) {

    const { error } =
        await supabaseClient
            .from("order_items")
            .delete()
            .eq("id", itemId);


    if (error) {

        console.error(error);

        alert("حدث خطأ أثناء حذف المنتج");

        return;
    }


    await updateOrderTotal();


// =========================
// حذف جميع منتجات السلة
// =========================

async function clearCart() {

    const confirmed = confirm(
        "هل أنت متأكد من حذف جميع منتجات السلة؟"
    );

    if (!confirmed) return;


    // الحصول على المستخدم

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if (userError || !user) {

        alert("يجب تسجيل الدخول أولاً");

        return;
    }


    // البحث عن السلة الحالية

    const {
        data: orders,
        error: ordersError
    } = await supabaseClient
        .from("orders")
        .select("id")
        .eq("user_id", user.id)
        .eq("status", "جديد")
        .order("id", {
            ascending: false
        })
        .limit(1);


    if (ordersError) {

        console.error(ordersError);

        alert("حدث خطأ أثناء البحث عن السلة");

        return;
    }


    if (!orders || orders.length === 0) {

        alert("السلة فارغة");

        return;
    }


    const orderId = orders[0].id;


    // حذف جميع منتجات السلة

    const {
        error: deleteError
    } = await supabaseClient
        .from("order_items")
        .delete()
        .eq("order_id", orderId);


    if (deleteError) {

        console.error(deleteError);

        alert(
            "حدث خطأ أثناء حذف منتجات السلة"
        );

        return;
    }


    // تصفير إجمالي الطلب

    const {
        error: totalError
    } = await supabaseClient
        .from("orders")
        .update({
            total: 0
        })
        .eq("id", orderId);


    if (totalError) {

        console.error(totalError);

        alert(
            "تم حذف المنتجات لكن حدث خطأ في تحديث الإجمالي"
        );

        return;
    }


    // تحديث الصفحة

    await loadOrders();

    loadNotifications();

}





  loadOrders();
loadNotifications();
}


// =========================
// تغيير الكمية
// =========================

async function changeQuantity(itemId, change) {

    const {
        data: item,
        error
    } = await supabaseClient
        .from("order_items")
        .select("*")
        .eq("id", itemId)
        .single();


    if (error || !item) {

        alert("حدث خطأ أثناء تعديل الكمية");

        return;
    }


    const newQuantity =
        (item.quantity || 1) + change;


    if (newQuantity <= 0) {

        await removeOrderItem(itemId);

        return;
    }


    const { error: updateError } =
        await supabaseClient
            .from("order_items")
            .update({
                quantity: newQuantity
            })
            .eq("id", itemId);


    if (updateError) {

        console.error(updateError);

        alert("حدث خطأ أثناء تعديل الكمية");

        return;
    }


    await updateOrderTotal();

    loadOrders();
}


// =========================
// تحديث الإجمالي
// =========================

async function updateOrderTotal() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) return;


    const {
        data: orders
    } = await supabaseClient
        .from("orders")
        .select("id")
        .eq("user_id", user.id)
        .eq("status", "جديد")
        .order("id", {
            ascending: false
        })
        .limit(1);


    if (!orders || orders.length === 0) return;


    const orderId = orders[0].id;


    const {
        data: items
    } = await supabaseClient
        .from("order_items")
        .select("quantity, price")
        .eq("order_id", orderId);


    const total =
        (items || []).reduce(
            (sum, item) =>
                sum +
                (
                    Number(item.price) || 0
                ) *
                (
                    Number(item.quantity) || 1
                ),
            0
        );


    await supabaseClient
        .from("orders")
        .update({
            total: total
        })
        .eq("id", orderId);

}


loadOrders();

    .eq("user_id", user.id);






            
            

        if (updateError) {

            console.error(updateError);

            alert(
                "حدث خطأ أثناء تقديم الطلب:\n" +
                updateError.message
            );

            return;
        }


        // =========================
        // نجاح
        // =========================

        alert(
            "تم تقديم الطلب بنجاح ✅\n\n" +
            "رقم الطلب: " +
            order.id +
            "\n" +
            "المندوب: " +
            driver.name
        );


        // =========================
        // إعادة التحميل
        // =========================

        location.reload();


    }

    catch (error) {

        console.error(error);

        alert(
            "حدث خطأ غير متوقع"
        );

    }

}

async function showPreviousOrders() {

    `;

    } = await supabaseClient.auth.getUser();

        container.innerHTML = `

                    <div style="

// =========================
// موقع العميل
// =========================

let customerLat = null;
let customerLng = null;
let customerMap = null;
let customerMarker = null;


// =========================
// فتح الخريطة
// =========================

function openLocationMap() {

    const oldMap =
        document.getElementById("locationMapModal");

    if (oldMap) {
        oldMap.remove();
    }


    const modal =
        document.createElement("div");

    modal.id = "locationMapModal";

    modal.innerHTML = `

        <div
            style="
                position:fixed;
                inset:0;
                background:rgba(0,0,0,.6);
                z-index:999999;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:15px;
            "
        >

            <div
                style="
                    width:100%;
                    max-width:600px;
                    height:80vh;
                    background:white;
                    border-radius:22px;
                    overflow:hidden;
                    display:flex;
                    flex-direction:column;
                "
            >

                <div
                    style="
                        padding:15px;
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        border-bottom:1px solid #eee;
                    "
                >

                    <strong>
                        📍 حدد موقع العميل
                    </strong>

                    <button
                        onclick="closeLocationMap()"
                        style="
                            width:38px;
                            height:38px;
                            border:none;
                            border-radius:50%;
                            background:#f1f1f1;
                            font-size:22px;
                            cursor:pointer;
                        "
                    >
                        ×
                    </button>

                </div>


                <div
                    id="customerMap"
                    style="
                        flex:1;
                        min-height:300px;
                    "
                ></div>


                <div
                    style="
                        padding:15px;
                        border-top:1px solid #eee;
                    "
                >

                    <button
                        onclick="confirmCustomerLocation()"
                        style="
                            width:100%;
                            height:52px;
                            border:none;
                            border-radius:14px;
                            background:#6557ed;
                            color:white;
                            font-family:inherit;
                            font-size:15px;
                            font-weight:800;
                            cursor:pointer;
                        "
                    >
                        ✅ تأكيد الموقع
                    </button>

                </div>

            </div>

        </div>

    `;

    document.body.appendChild(modal);

    document.body.style.overflow = "hidden";


    // إنشاء الخريطة

    setTimeout(() => {

        let startLat = 24.7136;
        let startLng = 46.6753;


        if (
            customerLat !== null &&
            customerLng !== null
        ) {

            startLat = customerLat;
            startLng = customerLng;

        }


        customerMap =
            L.map("customerMap")
                .setView(
                    [
                        startLat,
                        startLng
                    ],
                    13
                );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        ).addTo(customerMap);


        // إذا كان عنده موقع سابق

        if (
            customerLat !== null &&
            customerLng !== null
        ) {

            customerMarker =
                L.marker([
                    customerLat,
                    customerLng
                ])
                .addTo(customerMap);

        }


        // الضغط على الخريطة

        customerMap.on(
            "click",
            function(e) {

                customerLat =
                    e.latlng.lat;

                customerLng =
                    e.latlng.lng;


                if (customerMarker) {

                    customerMarker.setLatLng([
                        customerLat,
                        customerLng
                    ]);

                } else {

                    customerMarker =
                        L.marker([
                            customerLat,
                            customerLng
                        ])
                        .addTo(customerMap);

                }

            }
        );


    }, 100);

}


// =========================
// تأكيد الموقع
// =========================

function confirmCustomerLocation() {

    if (
        customerLat === null ||
        customerLng === null
    ) {

        alert(
            "اضغط على الخريطة وحدد موقع العميل أولاً"
        );

        return;
    }


    document.getElementById(
        "locationText"
    ).innerHTML = `

        <span style="color:#2e9d69;font-weight:800;">
            ✅ تم تحديد موقع العميل
        </span>

        <br>

        <span style="font-size:11px;">
            ${customerLat.toFixed(6)},
            ${customerLng.toFixed(6)}
        </span>

    `;


    closeLocationMap();

}


// =========================
// إغلاق الخريطة
// =========================

function closeLocationMap() {

    const modal =
        document.getElementById(
            "locationMapModal"
        );


    if (modal) {
        modal.remove();
    }


    document.body.style.overflow = "";


    customerMap = null;
    customerMarker = null;

}
