    <style>

            background: #f8f9fd;

        .header {
            width: min(1100px, calc(100% - 32px));
            margin: auto;
            padding: 22px 0;

            display: flex;

        .back-button {

<script>

let cartOrder = null;
let cartItems = [];
let isLinkedDriverCart = false;
const quantitySaveTimers = new Map();

function escapeCartHtml(value) {
    return String(value || "").replace(/[&<>'"]/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
    }[char]));
}

// يحوّل السعر والكمية إلى أرقام آمنة ثم يحسب إجمالي عناصر السلة نفسها.
function calculateCartItemsTotal(items = cartItems) {
    return (items || []).reduce((sum, item) => {
        const price = Number(item.price);
        const quantity = Number(item.quantity);
        return sum + (Number.isFinite(price) ? price : 0) * (Number.isFinite(quantity) && quantity > 0 ? quantity : 1);
    }, 0);
}

// يحدّث إجمالي الطلب في قاعدة البيانات بعد احتسابه من عناصر السلة المعروضة.
async function saveCartItemsTotal(order = cartOrder, items = cartItems) {
    if (!order?.id) return 0;
    const total = calculateCartItemsTotal(items);
    order.total = total;
    const { error } = await supabaseClient
        .from("orders")
        .update({ total })
        .eq("id", order.id);
    if (error) console.warn("تعذر حفظ إجمالي السلة:", error);
    return total;
}

// يعرض ملخص الطلب الجانبي للعميل مع حالة عنوان الاستلام والمخزن المختار.
function renderCustomerCartSummary(total, totalQuantity) {
    const summary = document.getElementById("customerCartSummary");
    if (!summary) return;
    if (isLinkedDriverCart) {
        summary.innerHTML = "";
        return;
    }

    const warehouse = localStorage.getItem("customer_warehouse") || "المنطقة المختارة";
    const savedDeliveryDetails = getStoredCustomerDeliveryDetails();
    const hasSavedDelivery = hasCompleteCustomerDelivery(cartOrder) || hasCompleteCustomerDelivery(savedDeliveryDetails);
    const savedAddress = localStorage.getItem("customer_delivery_address") || (hasSavedDelivery ? `موقع محدد: ${Number(cartOrder.customer_lat).toFixed(5)}, ${Number(cartOrder.customer_lng).toFixed(5)}` : "");
    summary.innerHTML = `
        <div class="customer-summary-delivery">
            <strong>📍 التوصيل من مخزن ${escapeCartHtml(warehouse)}</strong>
            <p>🚚 تجهيز سريع للطلب</p>
            <small>سيصل طلبك إلى المخزن المرتبط بالمنطقة المختارة.</small>
        </div>
        <div class="customer-summary-address"><span>التوصيل إلى الموقع الحالي</span>${hasSavedDelivery ? `<strong>📍 ${escapeCartHtml(savedAddress)}</strong><a href="customer-details.html">تغيير عنوان الاستلام</a>` : '<a href="customer-details.html">📍 سجل عنوان الاستلام</a>'}</div>
        <div class="customer-summary-totals">
            <div class="customer-summary-row"><span>عدد القطع</span><strong>${totalQuantity}</strong></div>
            <div class="customer-summary-row"><span>الإجمالي الفرعي</span><strong>${total.toFixed(2)} ر.س</strong></div>
            <div class="customer-summary-row customer-summary-total"><span>إجمالي الطلب</span><strong>${total.toFixed(2)} ر.س</strong></div>
        </div>
        <div class="customer-summary-actions">
            <button type="button" onclick="continueCustomerCheckout()">🛒 متابعة تقديم الطلب</button>
            <button type="button" class="summary-clear-cart" onclick="clearCart()">إفراغ السلة</button>
        </div>`;
}

// يقرأ العنوان الافتراضي المخزن على الجهاز مع حماية الصفحة من البيانات التالفة.
function getStoredCustomerDeliveryDetails() {
    try { return JSON.parse(localStorage.getItem("customer_delivery_details") || "{}"); }
    catch { return {}; }
}

// يتحقق من اكتمال بيانات العنوان قبل إرفاقها بالطلب أو إرساله إلى المخزن.
function hasCompleteCustomerDelivery(delivery) {
    const latitude = delivery?.customer_lat ?? delivery?.latitude;
    const longitude = delivery?.customer_lng ?? delivery?.longitude;
    return Boolean(delivery?.customer_name || (delivery?.firstName && delivery?.lastName)) && Boolean(delivery?.customer_phone || delivery?.phone) && Number.isFinite(Number(latitude)) && Number.isFinite(Number(longitude));
}

// يربط العنوان الافتراضي بالسلة الجديدة ثم يقدّمها مباشرة إلى مخزن المنطقة المختارة.
async function continueCustomerCheckout() {
    const button = document.querySelector(".customer-summary-actions button");
    if (button) { button.disabled = true; button.textContent = "جاري تقديم الطلب..."; }
    try {
        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
        if (userError || !user) throw new Error("يجب تسجيل الدخول أولًا.");
        const warehouse = localStorage.getItem("customer_warehouse") || "";
        const { data: orders, error: orderError } = await supabaseClient.from("orders").select("id, customer_name, customer_phone, customer_location, customer_lat, customer_lng").eq("user_id", user.id).eq("status", "جديد").eq("warehouse", warehouse).order("id", { ascending: false }).limit(1);
        if (orderError || !orders?.length) throw new Error("السلة فارغة أو لم تعد متاحة.");
        const order = orders[0];
        const savedDelivery = { ...(user.user_metadata?.delivery_address || {}), ...getStoredCustomerDeliveryDetails() };
        const orderHasDelivery = hasCompleteCustomerDelivery(order);
        if (!orderHasDelivery && !hasCompleteCustomerDelivery(savedDelivery)) {
            alert("الرجاء تسجيل عنوان التوصيل أولًا.");
            window.location.href = "customer-details.html";
            return;
        }
        const customerName = orderHasDelivery ? order.customer_name : `${savedDelivery.firstName} ${savedDelivery.lastName}`.trim();
        const customerPhone = orderHasDelivery ? order.customer_phone : savedDelivery.phone;
        const customerLat = orderHasDelivery ? Number(order.customer_lat) : Number(savedDelivery.latitude);
        const customerLng = orderHasDelivery ? Number(order.customer_lng) : Number(savedDelivery.longitude);
        const customerLocation = orderHasDelivery ? order.customer_location : `${savedDelivery.region} - حي ${savedDelivery.district} - شارع ${savedDelivery.street} • الموقع: ${customerLat.toFixed(6)},${customerLng.toFixed(6)}`;
        if (!orderHasDelivery) {
            const { error: addressError } = await supabaseClient.from("orders").update({ customer_name: customerName, customer_phone: customerPhone, customer_location: customerLocation, customer_lat: customerLat, customer_lng: customerLng }).eq("id", order.id).eq("user_id", user.id);
            if (addressError) throw addressError;
        }
        const { error: submitError } = await supabaseClient.rpc("submit_customer_order", {
            p_order_id: order.id,
            p_driver_number: null,
            p_driver_name: null,
            p_customer_name: customerName,
            p_customer_location: customerLocation,
            p_customer_lat: customerLat,
            p_customer_lng: customerLng,
            p_warehouse: warehouse
        });
        if (submitError) throw submitError;
        alert("تم تقديم الطلب بنجاح ✅");
        window.location.href = "customer-orders.html";
    } catch (error) {
        console.error("Customer cart submit error:", error);
        alert("تعذر تقديم الطلب: " + (error.message || "حاول مرة أخرى."));
        if (button) { button.disabled = false; button.textContent = "🛒 متابعة تقديم الطلب"; }
    }
}

// ينشئ بطاقة منتج عريضة لسلة العميل مع أزرار الكمية والحذف.
function createCustomerCartItemCard(item) {
    const itemTotal = Number(item.price || 0) * Number(item.quantity || 0);
    const card = document.createElement("article");
    card.className = "order-card customer-cart-item";
    card.innerHTML = `
        <div class="order-image">${item.image ? `<img src="${escapeCartHtml(item.image)}" alt="">` : "📱"}</div>
        <div class="order-info">
            <h3>${escapeCartHtml(item.type || item.product_type || item.model || "منتج")}</h3>
            <p>${escapeCartHtml([item.company, item.model, item.color].filter(Boolean).join(" • ")) || "تفاصيل المنتج"}</p>
            ${item.product_code ? `<p>كود المنتج: ${escapeCartHtml(item.product_code)}</p>` : ""}
            <div class="price">${itemTotal.toFixed(2)} ر.س</div>
        </div>
        <div class="quantity-controls">
            <button onclick="changeQuantity(${item.id}, -1)" aria-label="تقليل الكمية">−</button>
            <strong>${item.quantity || 1}</strong>
            <button onclick="changeQuantity(${item.id}, 1)" aria-label="زيادة الكمية">+</button>
        </div>
        <button class="delete-button" onclick="removeOrderItem(${item.id})" aria-label="حذف المنتج">🗑️</button>`;
    return card;
}

// يرسم عناصر السلة بحسب نوع الحساب: واجهة العميل الحديثة أو واجهة المندوب الحالية.
function renderCartView() {
    const container = document.getElementById("orders");
    const tools = document.getElementById("cartTools");
    const search = (document.getElementById("cartSearch")?.value || "").trim().toLowerCase();
    const groupBy = document.getElementById("cartGroupBy")?.value || "code";
    const visibleItems = cartItems.filter(item => [item.product_code, item.company, item.model, item.type, item.color]
        .filter(Boolean).join(" ").toLowerCase().includes(search));
    const totalQuantity = cartItems.reduce((sum, item) => sum + Number(item.quantity || 0), 0);

    tools.style.display = isLinkedDriverCart ? "block" : "none";
    const cartTotal = Number(cartOrder?.total || 0);
    document.getElementById("cartSummary").innerHTML = `
        <span>${cartItems.length} صنف</span>
        <span>${totalQuantity} قطعة</span>
        <span>الإجمالي: ${cartTotal.toFixed(2)} ر.س</span>`;
    renderCustomerCartSummary(cartTotal, totalQuantity);

    if (!visibleItems.length) {
        container.innerHTML = '<div class="cart-empty-filter">لا توجد منتجات مطابقة للبحث.</div>';
        return;
    }

    if (!isLinkedDriverCart) {
        container.innerHTML = "";
        visibleItems.forEach(item => container.appendChild(createCustomerCartItemCard(item)));
        return;
    }

    const groups = new Map();
    visibleItems.forEach(item => {
        const key = groupBy === "none" ? `item-${item.id}` : groupBy === "company"
            ? (item.company || "بدون شركة") : (item.product_code || "بدون كود");
        const group = groups.get(key) || [];
        group.push(item);
        groups.set(key, group);
    });

    container.innerHTML = "";
    groups.forEach((items, title) => {
        const group = document.createElement("section");
        group.className = "cart-group";
        const groupQuantity = items.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
        group.innerHTML = `<div class="cart-group-title"><strong>${escapeCartHtml(title)}</strong><span>${items.length} أصناف · ${groupQuantity} قطعة</span></div><div class="cart-group-items"></div>`;
        const groupItems = group.querySelector(".cart-group-items");

        items.forEach(item => {
            const itemTotal = Number(item.price || 0) * Number(item.quantity || 0);
            const card = document.createElement("article");
            card.className = "order-card";
            card.innerHTML = `
                <div class="order-image">${item.image ? `<img src="${escapeCartHtml(item.image)}" alt="">` : "📱"}</div>
                <div class="order-info">
                    <h3>${escapeCartHtml(item.type || item.product_type || item.model || "منتج")}</h3>
                    <p>${escapeCartHtml([item.company, item.type, item.color].filter(Boolean).join(" • "))}</p>
                    <p>${item.product_code ? `كود المنتج: ${escapeCartHtml(item.product_code)}` : ""}</p>
                    <div class="price">${itemTotal.toFixed(2)} ر.س</div>
                    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
                        <button onclick="changeQuantity(${item.id}, -1)" aria-label="تقليل الكمية" style="width:32px;height:32px;border:0;border-radius:10px;background:#eeeaff;color:#6557ed;font-size:18px;cursor:pointer;">−</button>
                        <strong style="min-width:25px;text-align:center;">${item.quantity || 1}</strong>
                        <button onclick="changeQuantity(${item.id}, 1)" aria-label="زيادة الكمية" style="width:32px;height:32px;border:0;border-radius:10px;background:#6557ed;color:#fff;font-size:18px;cursor:pointer;">+</button>
                    </div>
                </div>
                <button class="delete-button" onclick="removeOrderItem(${item.id})" aria-label="حذف المنتج">🗑️</button>`;
            groupItems.appendChild(card);
        });
        container.appendChild(group);
    });

    const total = document.createElement("div");
    total.className = "cart-total-box";
    total.innerHTML = `<strong>إجمالي الطلب</strong><strong>${Number(cartOrder.total || 0).toFixed(2)} ر.س</strong>`;
    container.appendChild(total);
}

document.getElementById("cartSearch")?.addEventListener("input", renderCartView);
document.getElementById("cartGroupBy")?.addEventListener("change", renderCartView);

// يحدد نوع الحساب ويملأ رقم المندوب تلقائياً عندما يكون البريد الحالي مربوطاً بسجل مندوب في الإدارة.
async function fillLinkedDriverNumber() {
    const driverInput = document.getElementById("driverNumber");
    const driverMessage = document.getElementById("driverMessage");
    if (!driverInput) return;
    const { data: identity, error } = await supabaseClient.rpc("get_my_driver_identity");
    isLinkedDriverCart = Boolean(!error && identity?.is_driver);
    document.body.classList.toggle("customer-cart", !isLinkedDriverCart);
    document.body.classList.toggle("driver-cart", isLinkedDriverCart);
    if (!isLinkedDriverCart) return;
    driverInput.value = identity.driver_number || "";
    driverInput.readOnly = true;
    driverInput.style.background = "#f4f3ff";
    if (driverMessage) {
        driverMessage.textContent = `المندوب المرتبط بالحساب: ${identity.driver_name || "مندوب"}`;
        driverMessage.style.color = "#6557ed";
    }
}

async function changeQuantity(itemId, change) {
    const item = cartItems.find(cartItem => Number(cartItem.id) === Number(itemId));
    if (!item) return;

    const newQuantity = Number(item.quantity || 1) + change;
    if (newQuantity <= 0) {
        clearTimeout(quantitySaveTimers.get(itemId));
        quantitySaveTimers.delete(itemId);
        await removeOrderItem(itemId);
        return;
    }

    // نُظهر التعديل فورًا؛ لا ننتظر الشبكة ولا نعيد تحميل السلة مع كل نقرة.
    item.quantity = newQuantity;
    cartOrder.total = cartItems.reduce((sum, cartItem) =>
        sum + Number(cartItem.price || 0) * Number(cartItem.quantity || 0), 0
    );
    renderCartView();

    clearTimeout(quantitySaveTimers.get(itemId));
    quantitySaveTimers.set(itemId, setTimeout(async () => {
        quantitySaveTimers.delete(itemId);
        const latestItem = cartItems.find(cartItem => Number(cartItem.id) === Number(itemId));
        if (!latestItem || !cartOrder) return;

        // نحفظ آخر كمية فقط بعد 600ms من آخر ضغطة.
        const [{ error: itemError }, { error: orderError }] = await Promise.all([
            supabaseClient.from("order_items").update({ quantity: latestItem.quantity }).eq("id", itemId),
            supabaseClient.from("orders").update({ total: cartOrder.total }).eq("id", cartOrder.id)
        ]);

        if (itemError || orderError) {
            console.error(itemError || orderError);
            alert("تعذر حفظ تعديل الكمية. سيتم إعادة تحميل السلة.");
            await loadOrders();
        }
    }, 600));
}

async function updateOrderTotal() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) return;

    const selectedCustomerWarehouse =
        localStorage.getItem("customer_warehouse") || "";

    if (!selectedCustomerWarehouse) return;


    const {
        data: orders
    } = await supabaseClient
        .from("orders")
        .select("id")
        .eq("user_id", user.id)
        .eq("status", "جديد")
        .eq("warehouse", selectedCustomerWarehouse)
        .order("id", {
            ascending: false
        })
        .limit(1);


    if (!orders || orders.length === 0) return;


    const orderId = orders[0].id;


    const {
        data: items
    } = await supabaseClient
        .from("order_items")
        .select("quantity, price")
        .eq("order_id", orderId);


    const total =
        (items || []).reduce(
            (sum, item) =>
                sum +
                (
                    Number(item.price) || 0
                ) *
                (
                    Number(item.quantity) || 1
                ),
            0
        );


    await supabaseClient
        .from("orders")
        .update({
            total: total
        })
        .eq("id", orderId);

}

            return;
        }

        // يمنع تقديم الطلب إذا كان المندوب تابعًا لمنطقة مختلفة عن منطقة تسوق العميل.
        const customerWarehouse = localStorage.getItem("customer_warehouse") || "";
        const driverWarehouse = driver.warehouse || "الرياض";

        if (!customerWarehouse) {
            driverMessage.textContent = "⚠️ اختر منطقة التسوق أولًا ثم أكمل الطلب.";
            driverMessage.style.color = "#e05265";
            return;
        }

        if (driverWarehouse !== customerWarehouse) {
            driverMessage.textContent = `⚠️ هذا المندوب تابع لمخزن ${driverWarehouse}، بينما منطقتك ${customerWarehouse}. الرجاء تغيير منطقتك أو اختيار مندوب مناسب.`;
            driverMessage.style.color = "#e05265";
            return;
        }


        // =========================
        // المندوب صحيح
        // =========================

        driverMessage.textContent =
            `✅ المندوب: ${driver.name}`;

        driverMessage.style.color =
            "#2e9d69";


        // =========================
        // التأكد من تسجيل الدخول
        // =========================

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();


        if (userError || !user) {

            alert("يجب تسجيل الدخول أولاً");

            window.location.href =
                "login.html";

            return;
        }


        // =========================
        // البحث عن السلة الحالية
        // =========================

        const {
            data: orders,
            error: ordersError
        } = await supabaseClient
            .from("orders")
            .select("*")
            .eq("user_id", user.id)
            .eq("status", "جديد")
            .eq("warehouse", customerWarehouse)
            .order("id", {
                ascending: false
            })
            .limit(1);


        if (ordersError) {

            console.error(ordersError);

            alert(
                "حدث خطأ أثناء البحث عن الطلب"
            );

            return;
        }


        // =========================
        // لا توجد سلة
        // =========================

        if (!orders || orders.length === 0) {

            alert("السلة فارغة");

            return;
        }


        const order = orders[0];


        // =========================
        // جلب المنتجات
        // =========================

        const {
            data: items,
            error: itemsError
        } = await supabaseClient
            .from("order_items")
            .select("*")
            .eq("order_id", order.id);


        if (itemsError) {

            console.error(itemsError);

            alert(
                "حدث خطأ أثناء قراءة المنتجات"
            );

            return;
        }


        if (!items || items.length === 0) {

            alert("السلة فارغة");

            return;
        }


        // =========================
        // تقديم الطلب
        // =========================

        // ينفذ تقديم الطلب وخصم كميات مخزون المنطقة في عملية واحدة آمنة.
        const {
            error: updateError
        } = await supabaseClient.rpc("submit_customer_order", {
            p_order_id: order.id,
            p_driver_number: driver.driver_number,
            p_driver_name: driver.name,
            p_customer_name: customerName,
            p_customer_location: (
                customerLat !== null && customerLng !== null
            ) ? `${customerLat},${customerLng}` : null,
            p_customer_lat: customerLat,
            p_customer_lng: customerLng,
            p_warehouse: customerWarehouse
        });






            
            

        if (updateError) {

            console.error(updateError);

            const isMissingSubmitFunction =
                updateError.code === "PGRST202" ||
                updateError.code === "42883" ||
                /submit_customer_order|Could not find the function/i.test(updateError.message || "");

            alert(
                isMissingSubmitFunction
                    ? "يلزم تفعيل إجراء تقديم الطلب في قاعدة البيانات. شغّل ملف fix-submit-order-inventory.sql من Supabase SQL Editor ثم أعد المحاولة."
                    : "حدث خطأ أثناء تقديم الطلب:\n" + updateError.message
            );

            return;
        }


        // =========================
        // نجاح
        // =========================

        alert(
            "تم تقديم الطلب بنجاح ✅\n\n" +
            "رقم الطلب: " +
            order.id +
            "\n" +
            "المندوب: " +
            driver.name
        );


        // =========================
        // إعادة التحميل
        // =========================

        location.reload();


    }

    catch (error) {

        console.error(error);

        alert(
            "حدث خطأ غير متوقع"
        );

    }

}

// =========================
// موقع العميل
// =========================

let customerLat = null;
let customerLng = null;
let customerMap = null;
let customerMarker = null;


// =========================
// فتح الخريطة
// =========================

function openLocationMap() {

    const oldMap =
        document.getElementById("locationMapModal");

    if (oldMap) {
        oldMap.remove();
    }


    const modal =
        document.createElement("div");

    modal.id = "locationMapModal";

    modal.innerHTML = `

        <div
            style="
                position:fixed;
                inset:0;
                background:rgba(0,0,0,.6);
                z-index:999999;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:15px;
            "
        >

            <div
                style="
                    width:100%;
                    max-width:600px;
                    height:80vh;
                    background:white;
                    border-radius:22px;
                    overflow:hidden;
                    display:flex;
                    flex-direction:column;
                "
            >

                <div
                    style="
                        padding:15px;
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        border-bottom:1px solid #eee;
                    "
                >

                    <strong>
                        📍 حدد موقع العميل
                    </strong>

                    <button
                        onclick="closeLocationMap()"
                        style="
                            width:38px;
                            height:38px;
                            border:none;
                            border-radius:50%;
                            background:#f1f1f1;
                            font-size:22px;
                            cursor:pointer;
                        "
                    >
                        ×
                    </button>

                </div>


                <div
                    id="customerMap"
                    style="
                        flex:1;
                        min-height:300px;
                    "
                ></div>


                <div
                    style="
                        padding:15px;
                        border-top:1px solid #eee;
                    "
                >

                    <button
                        onclick="confirmCustomerLocation()"
                        style="
                            width:100%;
                            height:52px;
                            border:none;
                            border-radius:14px;
                            background:#6557ed;
                            color:white;
                            font-family:inherit;
                            font-size:15px;
                            font-weight:800;
                            cursor:pointer;
                        "
                    >
                        ✅ تأكيد الموقع
                    </button>

                </div>

            </div>

        </div>

    `;

    document.body.appendChild(modal);

    document.body.style.overflow = "hidden";


    // إنشاء الخريطة

    setTimeout(() => {

        let startLat = 24.7136;
        let startLng = 46.6753;


        if (
            customerLat !== null &&
            customerLng !== null
        ) {

            startLat = customerLat;
            startLng = customerLng;

        }


        customerMap =
            L.map("customerMap")
                .setView(
                    [
                        startLat,
                        startLng
                    ],
                    13
                );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        ).addTo(customerMap);


        // إذا كان عنده موقع سابق

        if (
            customerLat !== null &&
            customerLng !== null
        ) {

            customerMarker =
                L.marker([
                    customerLat,
                    customerLng
                ])
                .addTo(customerMap);

        }


        // الضغط على الخريطة

        customerMap.on(
            "click",
            function(e) {

                customerLat =
                    e.latlng.lat;

                customerLng =
                    e.latlng.lng;


                if (customerMarker) {

                    customerMarker.setLatLng([
                        customerLat,
                        customerLng
                    ]);

                } else {

                    customerMarker =
                        L.marker([
                            customerLat,
                            customerLng
                        ])
                        .addTo(customerMap);

                }

            }
        );


    }, 100);

}


// =========================
// تأكيد الموقع
// =========================

function confirmCustomerLocation() {

    if (
        customerLat === null ||
        customerLng === null
    ) {

        alert(
            "اضغط على الخريطة وحدد موقع العميل أولاً"
        );

        return;
    }


    document.getElementById(
        "locationText"
    ).innerHTML = `

        <span style="color:#2e9d69;font-weight:800;">
            ✅ تم تحديد موقع العميل
        </span>

        <br>

        <span style="font-size:11px;">
            ${customerLat.toFixed(6)},
            ${customerLng.toFixed(6)}
        </span>

    `;


    closeLocationMap();

}


// =========================
// إغلاق الخريطة
// =========================

function closeLocationMap() {

    const modal =
        document.getElementById(
            "locationMapModal"
        );


    if (modal) {
        modal.remove();
    }


    document.body.style.overflow = "";


    customerMap = null;
    customerMarker = null;

}

async function clearCart() {

    console.log("بدأ حذف السلة...");

    try {

        // التأكد من المستخدم
        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();

        if (userError || !user) {
            alert("يجب تسجيل الدخول أولاً");
            return;
        }

        console.log("المستخدم:", user.id);


        // جلب السلة الحالية
        const {
            data: orders,
            error: orderError
        } = await supabaseClient
            .from("orders")
            .select("id")
            .eq("user_id", user.id)
            .eq("status", "جديد")
            .eq("warehouse", localStorage.getItem("customer_warehouse") || "")
            .order("id", {
                ascending: false
            })
            .limit(1);

        if (orderError) {
            console.error("خطأ جلب السلة:", orderError);
            alert("حدث خطأ أثناء جلب السلة");
            return;
        }


        if (!orders || orders.length === 0) {
            alert("السلة فارغة");
            return;
        }


        const orderId = cartOrder?.id || orders[0].id;

        console.log("رقم السلة:", orderId);


        // حذف جميع منتجات السلة
        const {
            error: deleteError
        } = await supabaseClient
            .from("order_items")
            .delete()
            .eq("order_id", orderId);


        if (deleteError) {

            console.error(
                "خطأ حذف المنتجات:",
                deleteError
            );

            alert(
                "لم يتم حذف المنتجات:\n" +
                deleteError.message
            );

            return;
        }


        console.log("تم حذف المنتجات ✅");


        // تصفير إجمالي السلة
        const {
            error: totalError
        } = await supabaseClient
            .from("orders")
            .update({
                total: 0
            })
            .eq("id", orderId)
            .eq("user_id", user.id);


        if (totalError) {

            console.error(
                "خطأ تحديث الإجمالي:",
                totalError
            );

        }


        // إعادة تحميل السلة
        await loadOrders();


        // إشعار
        alert("تم حذف جميع منتجات السلة 🗑️✅");

    }

    catch (error) {

        console.error(
            "خطأ غير متوقع:",
            error
        );

        alert(
            "حدث خطأ أثناء حذف السلة:\n" +
            error.message
        );

    }

}
