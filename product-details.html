        .detail-colors{display:flex;flex-wrap:wrap;gap:9px}.detail-color-choice{min-width:92px;padding:10px 13px;border:1px solid rgba(113,161,245,.32);border-radius:12px;background:rgba(10,34,76,.72);color:#f3f7ff;font:inherit;cursor:pointer;text-align:center}.detail-color-choice strong{display:block;font-size:13px}.detail-color-choice small{display:block;margin-top:3px;color:#9eb1d5;font-size:10px}.detail-color-choice.active{border-color:#4e9cff;background:rgba(35,110,232,.35);box-shadow:0 0 0 2px rgba(78,156,255,.16)}.detail-mixed-color-choice{border-style:dashed;background:rgba(54,114,226,.16)}

        .detail-main-image{padding:12px!important}.detail-main-image img{width:auto!important;height:auto!important;max-width:100%!important;max-height:100%!important;padding:0!important;object-fit:contain!important;display:block}
