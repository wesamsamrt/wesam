<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>التصنيف</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --purple: #6557ed;
            --bg: #f8f9fd;
            --text: #171827;
            --muted: #858796;
            --white: #ffffff;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            width: min(1100px, calc(100% - 32px));

            margin: auto;

            padding: 22px 0;

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .back-button {

            width: 46px;
            height: 46px;

            border-radius: 15px;

            background: white;

            box-shadow:
                0 8px 25px rgba(50,50,100,.07);

            font-size: 23px;

            cursor: pointer;
        }


        .header-title h1 {

            font-size: 22px;

            font-weight: 800;
        }


        .header-title p {

            font-size: 11px;

            color: var(--muted);
        }


        /* =========================
           SEARCH
        ========================= */

        .search {

            width: min(1100px, calc(100% - 32px));

            margin: 5px auto 28px;
        }


        .search-box {

            height: 56px;

            background: white;

            border-radius: 19px;

            box-shadow:
                0 8px 25px rgba(50,50,100,.06);

            display: flex;

            align-items: center;

            padding: 0 18px;

            gap: 10px;
        }


        .search-box span {

            font-size: 23px;

            color: var(--purple);
        }


        .search-box input {

            border: none;

            outline: none;

            width: 100%;

            font-family: inherit;

            font-size: 13px;

            background: transparent;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {

            width: min(1100px, calc(100% - 32px));

            margin: auto;
        }


        .section-title {

            margin-bottom: 15px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .section-title h2 {

            font-size: 20px;

            font-weight: 800;
        }


        .section-title span {

            color: var(--muted);

            font-size: 12px;
        }


        /* =========================
           TYPES
        ========================= */

        .types {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 15px;
        }


        .type-card {

            min-height: 155px;

            border-radius: 24px;

            padding: 20px;

            cursor: pointer;

            transition: .2s;

            box-shadow:
                0 8px 25px rgba(50,50,100,.035);
        }


        .type-card:hover {

            transform: translateY(-4px);
        }


        .type-card:active {

            transform: scale(.98);
        }


        .type-icon {

            width: 60px;
            height: 60px;

            border-radius: 19px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            margin-bottom: 12px;
        }


        .type-card h3 {

            font-size: 17px;

            font-weight: 800;

            margin-bottom: 3px;
        }


        .type-card p {

            font-size: 11px;

            color: #858595;
        }


        /* =========================
           COLORS
        ========================= */

        .card-1 {

            background: #eaf2ff;
        }

        .card-1 .type-icon {

            background: #d6e6ff;
        }


        .card-2 {

            background: #fff0f5;
        }

        .card-2 .type-icon {

            background: #ffdce9;
        }


        .card-3 {

            background: #e5f8ef;
        }

        .card-3 .type-icon {

            background: #cff1e1;
        }


        .card-4 {

            background: #fff3dc;
        }

        .card-4 .type-icon {

            background: #ffe4ae;
        }


        .card-5 {

            background: #f0ecff;
        }

        .card-5 .type-icon {

            background: #ded5ff;
        }


        .card-6 {

            background: #e7f8fb;
        }

        .card-6 .type-icon {

            background: #cceff4;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            text-align: center;

            padding: 40px 10px;

            color: var(--muted);

            font-size: 13px;
        }


        .empty {

            text-align: center;

            padding: 40px 10px;

            color: var(--muted);

            font-size: 13px;

            background: white;

            border-radius: 20px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 550px) {

            .types {

                grid-template-columns: 1fr;
            }

            .type-card {

                min-height: 140px;
            }

        }

    </style>

    <!-- طبقة التصميم الداكن للتصنيفات؛ تُعطّل تلقائياً لحساب المندوب. -->
    <style id="categoryDarkThemeStyles">
        :root { --purple:#2879ff; --bg:#030a19; --text:#f4f7ff; --muted:#9cabca; --white:#081936; }
        body { background:radial-gradient(circle at 14% 0%,rgba(16,99,247,.21),transparent 30%),linear-gradient(135deg,#020714,#071a38 54%,#020a1b); color:var(--text); }
        .header,.search,.content { width:min(1250px,calc(100% - 40px)); }
        .header { padding:26px 0 16px; }.back-button { border:1px solid rgba(92,151,255,.42); background:linear-gradient(135deg,rgba(15,47,104,.94),rgba(5,22,57,.94)); color:#eaf2ff; box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.22); }
        .header-title h1,.section-title h2 { color:#f4f7ff; }.header-title p,.section-title span,.type-card p { color:#9cabca; }
        .search { margin-bottom:16px; }.search-box { height:58px; border:1px solid rgba(96,153,255,.44); border-radius:18px; background:rgba(7,25,59,.84); box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 25px rgba(0,0,0,.2); }.search-box span { color:#5ca3ff; }.search-box input { color:#eff5ff; }.search-box input::placeholder { color:#879cbe; }
        .types { grid-template-columns:repeat(3,1fr); gap:15px; }.type-card,.card-1,.card-2,.card-3,.card-4,.card-5,.card-6 { min-height:165px; border:1px solid rgba(94,139,216,.37); background:linear-gradient(155deg,rgba(17,40,85,.95),rgba(5,19,47,.98)); box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 28px rgba(0,0,0,.18); color:#f2f6ff; }.type-card:hover { border-color:#408fff; box-shadow:0 0 19px rgba(38,119,255,.2); }.type-icon,.card-1 .type-icon,.card-2 .type-icon,.card-3 .type-icon,.card-4 .type-icon,.card-5 .type-icon,.card-6 .type-icon { background:radial-gradient(circle,rgba(56,138,255,.35),rgba(9,35,81,.58)); color:#71b2ff; box-shadow:0 0 15px rgba(34,117,255,.18); }.loading,.empty { border:1px solid rgba(94,139,216,.32); background:rgba(7,24,57,.75); color:#a9b8d1; }
        @media (max-width:550px) { .header,.search,.content { width:calc(100% - 24px); }.header { padding:16px 0 10px; }.types { grid-template-columns:repeat(2,1fr); gap:10px; }.type-card { min-height:135px; padding:15px; border-radius:18px; }.type-icon { width:50px; height:50px; font-size:25px; }.type-card h3 { font-size:14px; } }
    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <button
            class="back-button"
            onclick="history.back()"
        >
            →
        </button>


        <div class="header-title">

            <h1 id="categoryTitle">
                جاري التحميل...
            </h1>

            <p id="categoryDescription">
                جاري تحميل التصنيف...
            </p>

        </div>

    </header>


    <!-- =========================
         SEARCH
    ========================= -->

    <div class="search">

        <div class="search-box">

            <span>
                ⌕
            </span>

            <input
                id="searchInput"
                type="text"
                placeholder="ابحث عن نوع المنتج..."
            >

        </div>

    </div>


    <!-- =========================
         CONTENT
    ========================= -->

    <main class="content">


        <div class="section-title">

            <h2>
                أنواع المنتجات
            </h2>

            <span id="countText">
                ...
            </span>

        </div>


        <div
            class="types"
            id="typesContainer"
        >

            <div class="loading">
                جاري تحميل الأنواع...
            </div>

        </div>


    </main>



    <script>


        /* =========================
           VARIABLES
        ========================= */

        let currentCategory = null;

        let allTypes = [];

        // يحدد مخزن المنطقة نفسه المستخدم في صفحة المنتجات حتى لا تظهر أنواع من مخزن آخر.
        async function resolveCategoryWarehouse() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return "الرياض";

            const { data: driverIdentity } = await supabaseClient.rpc("get_my_driver_identity");
            if (driverIdentity?.is_driver && driverIdentity?.warehouse) {
                return driverIdentity.warehouse;
            }

            return localStorage.getItem("customer_warehouse") || "الرياض";
        }

        // يعطّل اللون الداكن لحساب المندوب لتبقى له واجهة التصنيفات الكلاسيكية.
        async function applyCategoryThemeForAccount() {
            const theme = document.getElementById("categoryDarkThemeStyles");
            if (!theme) return;

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;

            const { data: driverIdentity } = await supabaseClient.rpc("get_my_driver_identity");
            theme.media = driverIdentity?.is_driver ? "not all" : "all";
        }



        /* =========================
           GET CATEGORY ID
        ========================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const categoryId =
            params.get("id");



        /* =========================
           LOAD CATEGORY
        ========================= */

        async function loadCategory() {


            if (!categoryId) {

                document
                    .getElementById("categoryTitle")
                    .textContent =
                    "التصنيف غير موجود";


                document
                    .getElementById("categoryDescription")
                    .textContent =
                    "لم يتم تحديد تصنيف";


                return;
            }



            const { data, error } =

                await supabaseClient

                    .from("categories")

                    .select("*")

                    .eq("id", categoryId)

                    .single();



            if (error) {

                console.error(error);


                document
                    .getElementById("categoryTitle")
                    .textContent =
                    "حدث خطأ";


                document
                    .getElementById("categoryDescription")
                    .textContent =
                    "تعذر تحميل التصنيف";


                return;
            }



            currentCategory = data;



            document
                .getElementById("categoryTitle")
                .textContent =
                (data.name|| "📦") 
                



            document
                .getElementById("categoryDescription")
                .textContent =
                "اختر ما تريد من " +
                data.name;



            /* بعد معرفة التصنيف */

            loadProductTypes();

        }



        /* =========================
           LOAD PRODUCT TYPES
        ========================= */

        async function loadProductTypes() {


            const container =
                document.getElementById(
                    "typesContainer"
                );


            container.innerHTML = `

                <div class="loading">
                    جاري تحميل الأنواع...
                </div>

            `;

            const categoryWarehouse = await resolveCategoryWarehouse();



            const { data, error } =

                await supabaseClient

                    .from("products")

                    .select("product_type")

                    .eq(
                        "category",
                        currentCategory.name
                    )

                    .eq(
                        "warehouse",
                        categoryWarehouse
                    );



            if (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="empty">
                        حدث خطأ في تحميل أنواع المنتجات
                    </div>

                `;

                return;
            }



            /* إزالة الأنواع المكررة */

            allTypes = [

                ...new Set(

                    data

                        .map(item =>
                            item.product_type
                        )

                        .filter(type =>
                            type &&
                            type.trim() !== ""
                        )

                )

            ];



            document
                .getElementById("countText")
                .textContent =
                allTypes.length +
                " أنواع متوفرة في مخزن " + categoryWarehouse;



            renderTypes(allTypes);

        }



        /* =========================
           DISPLAY TYPES
        ========================= */

        function renderTypes(types) {


            const container =
                document.getElementById(
                    "typesContainer"
                );


            container.innerHTML = "";



            if (!types.length) {

                container.innerHTML = `

                    <div class="empty">

                        لا توجد أنواع منتجات
                        لهذا التصنيف حاليًا

                    </div>

                `;

                return;
            }



            types.forEach(
                (type, index) => {


                    const card =
                        document.createElement(
                            "div"
                        );


                    const colorNumber =
                        (index % 6) + 1;


                    card.className =
                        "type-card card-" +
                        colorNumber;



                    /* أيقونة مؤقتة */

                    let icon = "📦";


                    if (
                        type.includes("شاشة")
                    ) {

                        icon = "🛡️";

                    } else if (
                        type.includes("كاميرا")
                    ) {

                        icon = "📷";

                    } else if (
                        type.includes("كفر")
                    ) {

                        icon = "📱";

                    } else if (
                        type.includes("شاحن")
                    ) {

                        icon = "🔌";

                    } else if (
                        type.includes("سماعة")
                    ) {

                        icon = "🎧";

                    }



                    card.innerHTML = `

                        <div class="type-icon">
                            ${icon}
                        </div>

                        <h3>
                            ${type}
                        </h3>

                        <p>
                            منتجات ${type}
                        </p>

                    `;



                    card.onclick =
                        function () {


                            window.location.href =

                                "products.html" +

                                "?category=" +

                                encodeURIComponent(
                                    currentCategory.name
                                ) +

                                "&type=" +

                                encodeURIComponent(
                                    type
                                );

                        };



                    container.appendChild(card);

                }
            );

        }



        /* =========================
           SEARCH
        ========================= */

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                function () {


                    const search =
                        this.value
                            .trim()
                            .toLowerCase();



                    if (!search) {

                        renderTypes(allTypes);

                        return;

                    }



                    const filtered =
                        allTypes.filter(
                            type =>
                                type
                                    .toLowerCase()
                                    .includes(search)
                        );


                    renderTypes(filtered);

                }
            );



        /* =========================
           START
        ========================= */

        applyCategoryThemeForAccount();
        loadCategory();


    </script>

<script src="./no-zoom.js"></script>

</body>

</html>
